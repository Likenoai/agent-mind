const DURATION=16.770612;
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const ease=p=>{p=clamp(p);return p*p*(3-2*p)};
const out=p=>1-Math.pow(1-clamp(p),3);
const set=(id,attrs)=>{const el=$(id);if(!el)return;for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v)};
const show=(id,v)=>set(id,{opacity:clamp(v)});
const move=(id,x,y,scale=1,rot=0)=>set(id,{transform:`translate(${x} ${y}) rotate(${rot}) scale(${scale})`});
const pathPoint=(id,p)=>{const el=$(id);if(!el)return{x:0,y:0};const len=el.getTotalLength();return el.getPointAtLength(clamp(p)*len)};
const pulse=(id,p,period=1)=>show(id,.5+.5*Math.sin(p*Math.PI*2/period));
let now=0,playing=false,raf=0,last=0;
function render(t){now=clamp(t,0,DURATION);const p=now/DURATION;
show('resource',out(p/.10));show('actionMachine',out((p-.05)/.14));show('dashboard',out((p-.16)/.12));
// existing stock enters a real task; output is physically carried to the observation panel
const resourceTravel=clamp((p-.18)/.18),rp=pathPoint('resourcePath',resourceTravel);show('resourceToken',out((p-.18)/.07)*(1-clamp((p-.34)/.05)));move('resourceToken',rp.x-63,rp.y-27,1,0);show('resource',1-clamp((p-.28)/.06));
const line=out((p-.28)/.12);show('outputPath',line);set('outputPath',{'stroke-dashoffset':String(-p*170)});const outputIn=out((p-.34)/.12);show('outputCard',outputIn);set('outputCard',{transform:`translate(${lerp(-150,0,outputIn)} ${lerp(45,0,outputIn)})`});
const measures=out((p-.48)/.18);['metricBar1','metricBar2','metricBar3','metricBar4'].forEach((id,i)=>{const y=[194,252,310,368][i];const x=lerp(1158,1232,clamp((p-.48-i*.025)/.16));set(id,{d:`M${x} ${y}h14`});show(id,measures)});
show('outcomes',out((p-.66)/.10));show('feedbackLine',out((p-.78)/.10));show('keyline',out((p-.86)/.10));
 $('clock').textContent=`${now.toFixed(1)} / ${DURATION.toFixed(1)}s`; $('seek').value=String(now);}
function frame(ts){if(!playing)return;if(!last)last=ts;const dt=Math.min(.05,(ts-last)/1000);last=ts;now=Math.min(DURATION,now+dt);render(now);if(now>=DURATION){playing=false;last=0;$('play').textContent='播放';return}raf=requestAnimationFrame(frame)}
function play(){if(now>=DURATION)now=0;playing=true;$('play').textContent='暂停';last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(frame)}
function pause(){playing=false;last=0;cancelAnimationFrame(raf);$('play').textContent='继续'}
function replay(){pause();render(0);play()}
function seek(t){pause();render(Number(t)||0)}
$('play').addEventListener('click',()=>playing?pause():play());$('replay').addEventListener('click',replay);$('seek').addEventListener('input',e=>seek(e.target.value));
render(0);
window.__cue10={duration:DURATION,render,seek,play,pause,replay,get time(){return now},get playing(){return playing}};
