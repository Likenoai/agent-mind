const DURATION=20.349388;
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const ease=p=>{p=clamp(p);return p*p*(3-2*p)};
const out=p=>1-Math.pow(1-clamp(p),3);
const set=(id,attrs)=>{const el=$(id);if(!el)return;for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v)};
const show=(id,v)=>set(id,{opacity:clamp(v)});
const move=(id,x,y,scale=1,rot=0)=>set(id,{transform:`translate(${x} ${y}) rotate(${rot}) scale(${scale})`});
const pathPoint=(id,p)=>{const el=$(id);if(!el)return{x:0,y:0};const len=el.getTotalLength();return el.getPointAtLength(clamp(p)*len)};
const pulse=(id,p,period=1)=>show(id,.5+.5*Math.sin(p*Math.PI*2/period));
let now=0,playing=false,raf=0,last=0;
function render(t){now=clamp(t,0,DURATION);const p=now/DURATION;
show('memoryPanel',out(p/.10));show('externalPanel',out((p-.04)/.12));show('request',out((p-.12)/.12));
// request probes both stores; the first attempt reaches a gap
const probe=out((p-.22)/.18);show('memSearch',probe);show('fileSearch',probe);
const a=pathPoint('memSearch',clamp((p-.26)/.28)),b=pathPoint('fileSearch',clamp((p-.26)/.28));set('memDot',{cx:a.x,cy:a.y,opacity:probe});set('fileDot',{cx:b.x,cy:b.y,opacity:probe});
show('memoryFail',out((p-.46)/.08)*(1-out((p-.68)/.08)));show('fileFail',out((p-.46)/.08)*(1-out((p-.68)/.08)));
// add retrieval cues and organize the external archive; then the same request succeeds
const repair=out((p-.62)/.13);set('memoryNet',{opacity:1});set('memoryNodes',{opacity:1});set('memoryTrace',{transform:`translate(${0} ${-4*repair})`});set('indexedFile',{opacity:repair});set('filePile',{opacity:1-repair*.65});
show('memRetrieved',out((p-.78)/.08));show('fileRetrieved',out((p-.78)/.08));show('keyline',out((p-.84)/.10));
// highlight association links and indexed file
set('memoryNet',{stroke:repair>.2?'#9b83b5':'#cfc2d9','stroke-width':repair>.2?5:4});
 $('clock').textContent=`${now.toFixed(1)} / ${DURATION.toFixed(1)}s`; $('seek').value=String(now);}

function pause(){playing=false;last=0;cancelAnimationFrame(raf);$('play').textContent='继续'}
function replay(){pause();render(0);play()}
function seek(t){pause();render(Number(t)||0)}
$('play').addEventListener('click',()=>playing?pause():play());$('replay').addEventListener('click',replay);$('seek').addEventListener('input',e=>seek(e.target.value));
render(0);
window.__cue08={duration:DURATION,render,seek,play,pause,replay,get time(){return now},get playing(){return playing}};
