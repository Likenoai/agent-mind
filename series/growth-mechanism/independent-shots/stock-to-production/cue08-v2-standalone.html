const DURATION=20.349388; let current=0,playing=true,last=performance.now();
const $=id=>document.getElementById(id); const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)); const ease=v=>{v=clamp(v);return v*v*(3-2*v)};
function point(pathId,p){const path=$(pathId);if(!path)return{x:0,y:0};const l=path.getTotalLength();return path.getPointAtLength(clamp(p)*l)}
function moveOn(elId,pathId,p){const el=$(elId);if(!el)return;const q=point(pathId,p);el.setAttribute('transform',`translate(${q.x},${q.y})`);}
function fade(elId,v){const el=$(elId);if(el)el.style.opacity=clamp(v)}
function set(elId,attr,val){const el=$(elId);if(el)el.setAttribute(attr,val)}
function render(t){const a=clamp((t-2)/5.2),b=clamp((t-8.2)/4.2);moveOn('memoryPulse','memoryRoute',ease(a));fade('memoryPulse',t<2?0:t<7.3?1:0);fade('memoryTrace',t<3?0:t<5?ease((t-3)/2):1);
fade('associationRoute',ease(b));moveOn('associationPulse','associationRoute',ease(b));fade('associationPulse',t<8.2?0:t<12.5?1:0);
const r=clamp((t-3)/7.5);moveOn('archivePulse','archiveRoute',ease(r));fade('archivePulse',t<3?0:t<10.5?1:0);set('indexWheel','transform',`translate(1285 250) rotate(${t*48})`);
const drawer=clamp((t-10.5)/2);set('targetDrawer','transform',`translate(${ease(drawer)*42} 0)`);fade('retrievedFile',ease((t-11.2)/1.2));
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)current=Math.min(DURATION,current+dt);render(current);$('seek').value=current;$('time').textContent=current.toFixed(1)+' / '+DURATION.toFixed(1);if(current>=DURATION)playing=false;$('play').textContent=playing?'暂停':'继续';requestAnimationFrame(frame)}
$('play').onclick=()=>{playing=!playing;last=performance.now()};$('restart').onclick=()=>{current=0;playing=true;last=performance.now()};$('seek').oninput=e=>{current=+e.target.value;render(current);last=performance.now()};render(0);requestAnimationFrame(frame);
</script></body></html>
