const DURATION=18.834286; let current=0,playing=true,last=performance.now();
const $=id=>document.getElementById(id); const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)); const ease=v=>{v=clamp(v);return v*v*(3-2*v)};

function set(elId,attr,val){const el=$(elId);if(el)el.setAttribute(attr,val)}
function render(t){const p=clamp((t-4.2)/7.4); const q=point('pickRoute',ease(p));
const docked=t>11.5; const tokenScale=docked?(.55):1; set('movingTemplate','transform',`translate(${q.x} ${q.y}) scale(${tokenScale})`); fade('movingTemplate',t<4.2?0:t<5?ease((t-4.2)/.8):1);
const retract=ease((t-11.5)/1.3);const armX=q.x*(1-retract)+760*retract,armY=(q.y-4)*(1-retract)+431*retract, elbowX=(760+armX)/2+16, elbowY=(431+armY)/2-64; set('armLink1','d',`M760 431 L${elbowX} ${elbowY}`);set('armInner1','d',`M760 431 L${elbowX} ${elbowY}`);set('armLink2','d',`M${elbowX} ${elbowY} L${armX} ${armY}`);set('armInner2','d',`M${elbowX} ${elbowY} L${armX} ${armY}`);set('armElbow','cx',elbowX);set('armElbow','cy',elbowY);set('armJoint','cx',armX);set('armJoint','cy',armY);set('gripper','transform',`translate(${armX} ${armY})`);
fade('dockGlow',t<11?0:ease((t-11)/1.2)); fade('captionAsset',t<4.2?1:.55+.45*(1-p));
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)current=Math.min(DURATION,current+dt);render(current);$('seek').value=current;$('time').textContent=current.toFixed(1)+' / '+DURATION.toFixed(1);if(current>=DURATION)playing=false;$('play').textContent=playing?'暂停':'继续';requestAnimationFrame(frame)}
