const $=id=>document.getElementById(id); const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)); const ease=v=>{v=clamp(v);return v*v*(3-2*v)};
function point(pathId,p){const path=$(pathId);if(!path)return{x:0,y:0};const l=path.getTotalLength();return path.getPointAtLength(clamp(p)*l)}

}
