</style></head><body><div class="stage"><main class="frame"><header class="top"><div class="eyebrow">GROWTH MECHANISM / CUE 16 · SHOT PREVIEW V1</div><div class="title">案例：一次视频完成之后</div><div class="subtitle">完成一件作品，同时会留下多种可能的副产品。</div><div class="duration">CUE 16 · 17.32s SLOT</div></header><section class="canvas"><svg id="scene" class="scene" viewBox="0 0 1440 610" role="img" aria-label="第一次视频制作产生已发布作品和潜在可复用成果，二者不是同一件事"><defs>

</svg></section><footer class="bottom"><div class="caption">作品被发布，不代表制作过程中的成果都被留下。</div><div class="controls"><span class="time" id="time">00.0 / 17.3</span><input class="seek" id="seek" type="range" min="0" max="17.319184" step="0.01" value="0"><button class="btn primary" id="play">暂停</button><button class="btn" id="restart">重播</button></div></footer></main></div><script>
const DURATION=17.319184;let current=0,playing=true,last=performance.now();const $=id=>document.getElementById(id);
function render(t){const e=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=e(v);return v*v*(3-2*v)};
const press=ease((t-2)/2);$('pressHead').setAttribute('transform',`translate(0 ${press*62})`);$('workpiece').setAttribute('transform',`translate(0 ${press*48})`);
const publish=ease((t-6)/3);$('publishedPoster').style.opacity=publish;const pth=$('videoRoute'),pt=pth.getPointAtLength(publish*pth.getTotalLength());$('publishPulse').setAttribute('transform',`translate(${pt.x} ${pt.y})`);$('publishPulse').style.opacity=t<6?0:1;
['assetNotes','assetSkill','assetSub','assetCode'].forEach((id,i)=>{const q=ease((t-(7+i*1.6))/1.1);$(id).style.opacity=q;$(id).setAttribute('transform',`translate(0 ${(1-q)*18})`)});
const pulse=ease((t-8)/4);$('assetPulse').style.opacity=t<8?0:1;const p2=$('partsRoute').getPointAtLength(pulse*$('partsRoute').getTotalLength());$('assetPulse').setAttribute('transform',`translate(${p2.x} ${p2.y})`);
$('gear1').setAttribute('transform',`translate(485 420) rotate(${t*35})`);$('gear2').setAttribute('transform',`translate(940 420) rotate(${-t*48})`);
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)current=Math.min(DURATION,current+dt);render(current);$('seek').value=current;$('time').textContent=current.toFixed(1)+' / '+DURATION.toFixed(1);if(current>=DURATION)playing=false;$('play').textContent=playing?'暂停':'继续';requestAnimationFrame(frame)}
$('play').onclick=()=>{playing=!playing;last=performance.now()};$('restart').onclick=()=>{current=0;playing=true;last=performance.now()};$('seek').oninput=e=>{current=+e.target.value;render(current);last=performance.now()};render(0);requestAnimationFrame(frame);
</script></body></html>
