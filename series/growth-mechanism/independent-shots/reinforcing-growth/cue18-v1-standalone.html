const DURATION=17.240816;let current=0,playing=true,last=performance.now();const $=id=>document.getElementById(id);
function render(t){const e=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=e(v);return v*v*(3-2*v)};const pt=(id,u)=>{const q=$(id).getPointAtLength(e(u)*$(id).getTotalLength());return q};
const shorten=ease((t-2)/4);$('shortBar').setAttribute('width',String(270*(1-.32*shorten)));$('longBar').setAttribute('width','270');$('workflowGear').setAttribute('transform',`translate(720 252) rotate(${t*35})`);
const a=ease((t-5)/3),b=ease((t-7)/3),c=ease((t-9)/4);let pa=pt('restRoute',a),pb=pt('nextRoute',b),pc=pt('upgradeRoute',c);
$('tokenRest').setAttribute('transform',`translate(${pa.x} ${pa.y})`);$('tokenNext').setAttribute('transform',`translate(${pb.x} ${pb.y})`);$('tokenUpgrade').setAttribute('transform',`translate(${pc.x} ${pc.y})`);
$('tokenRest').style.opacity=t<5?0:(t>11?1-e((t-11)/1.2):1);$('tokenNext').style.opacity=t<7?0:(t>11?1-e((t-11)/1.2):1);$('tokenUpgrade').style.opacity=t<9?0:(t>12?1-e((t-12)/1.2):1);
$('restFill').setAttribute('width',String(10+a*62));$('nextPoster').style.opacity=b;
const up=ease((t-12)/2);$('upgradeGear').setAttribute('transform',`translate(850 520) rotate(${t*52}) scale(${.7+.3*up})`);
$('feedbackLoop').style.opacity=ease((t-14)/1.5);$('nextBase').style.opacity=up;
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)current=Math.min(DURATION,current+dt);render(current);$('seek').value=current;$('time').textContent=current.toFixed(1)+' / '+DURATION.toFixed(1);if(current>=DURATION)playing=false;$('play').textContent=playing?'暂停':'继续';requestAnimationFrame(frame)}
$('play').onclick=()=>{playing=!playing;last=performance.now()};$('restart').onclick=()=>{current=0;playing=true;last=performance.now()};$('seek').oninput=e=>{current=+e.target.value;render(current);last=performance.now()};render(0);requestAnimationFrame(frame);
</script></body></html>
