const DURATION=20.349388;let current=0,playing=true,last=performance.now();const $=id=>document.getElementById(id);
function render(t){const p=(id,route,u)=>{const path=$(route),pt=path.getPointAtLength(Math.max(0,Math.min(1,u))*path.getTotalLength());$(id).setAttribute('transform',`translate(${pt.x} ${pt.y})`)};
const a=Math.max(0,Math.min(1,(t-2)/5)),b=Math.max(0,Math.min(1,(t-4)/6)),c=Math.max(0,Math.min(1,(t-6)/5));
p('flowA','routeA',a);p('flowB','routeB',b);p('flowC','routeC',c);
$('flowA').style.opacity=t<2?0:1;$('flowB').style.opacity=t<4?0:1;$('flowC').style.opacity=t<6?0:1;
['outputCard1','outputCard2','outputCard3'].forEach((id,i)=>{$(id).style.opacity=Math.max(0,Math.min(1,(t-(7+i*2))/1));$(id).setAttribute('transform',`translate(0 ${t<7+i*2?18:0})`)});
const gear=Math.max(0,Math.min(1,(t-8)/3));$('gearBase').setAttribute('transform',`translate(1155 304) rotate(${t*24}) scale(${.75+.25*gear})`);$('toolSpark').style.opacity=gear;
const charge=Math.max(0,Math.min(1,(t-8)/5));$('batteryFill').setAttribute('width',`${15+charge*64}`);$('batteryFill').setAttribute('fill',charge>.7?'#83b85b':'#7ca8cf');$('resourceCore').setAttribute('transform',`translate(0 ${Math.sin(t*1.7)*3})`);
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)current=Math.min(DURATION,current+dt);render(current);$('seek').value=current;$('time').textContent=current.toFixed(1)+' / '+DURATION.toFixed(1);if(current>=DURATION)playing=false;$('play').textContent=playing?'暂停':'继续';requestAnimationFrame(frame)}
$('play').onclick=()=>{playing=!playing;last=performance.now()};$('restart').onclick=()=>{current=0;playing=true;last=performance.now()};$('seek').oninput=e=>{current=+e.target.value;render(current);last=performance.now()};render(0);requestAnimationFrame(frame);
</script></body></html>
