const DURATION=19.226122;let current=0,playing=true,last=performance.now();const $=id=>document.getElementById(id);
function render(t){const e=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=e(v);return v*v*(3-2*v)};const pt=(path,u)=>{const q=$(path).getPointAtLength(e(u)*$(path).getTotalLength());return q};
const a=ease((t-2)/4);let q=pt('retrieveRoute',a);$('templateToken').setAttribute('transform',`translate(${q.x} ${q.y})`);$('templateToken').style.opacity=t<2?0:1;
const adjust=ease((t-8)/3);$('portraitFrame').setAttribute('width',String(58+adjust*30));$('portraitFrame').setAttribute('x',String(805-adjust*15));$('sliderLeft').setAttribute('transform',`translate(${adjust*14} 0)`);$('sliderRight').setAttribute('transform',`translate(${-adjust*14} 0)`);
const b=ease((t-11)/4);let out=pt('applyRoute',b);$('successPulse').style.opacity=t<11?0:b;$('successPulse').setAttribute('transform',`translate(${out.x-1205} ${out.y-350})`);
const r=ease((t-12)/3);let back=pt('returnRoute',r);$('returnPulse').setAttribute('transform',`translate(${back.x} ${back.y})`);$('returnPulse').style.opacity=t<12?0:1;
$('archiveGlow').style.opacity=ease((t-14)/2);$('drawer1').setAttribute('transform',`translate(0 ${Math.sin(t*2)*1.5})`);$('drawer2').setAttribute('transform',`translate(0 ${-Math.sin(t*2)*1.5})`);
}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)current=Math.min(DURATION,current+dt);render(current);$('seek').value=current;$('time').textContent=current.toFixed(1)+' / '+DURATION.toFixed(1);if(current>=DURATION)playing=false;$('play').textContent=playing?'暂停':'继续';requestAnimationFrame(frame)}
$('play').onclick=()=>{playing=!playing;last=performance.now()};$('restart').onclick=()=>{current=0;playing=true;last=performance.now()};$('seek').oninput=e=>{current=+e.target.value;render(current);last=performance.now()};render(0);requestAnimationFrame(frame);
</script></body></html>
