<script>
const DURATION=20114.286;
const $=id=>document.getElementById(id);
const ns="http://www.w3.org/2000/svg";
let elapsed=0,start=performance.now(),paused=false,raf=0;
const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)};
const lerp=(a,b,t)=>a+(b-a)*t;
const sceneDefs=[
 {id:"scene1",a:0,b:5600,enter:650,exit:500,fromX:-42,fromY:0,toX:-48,toY:0},
 {id:"scene2",a:5600,b:8350,enter:450,exit:450,fromX:0,fromY:38,toX:0,toY:-34},
 {id:"scene3",a:8350,b:13750,enter:520,exit:500,fromX:46,fromY:0,toX:44,toY:0},
 {id:"scene4",a:13750,b:DURATION,enter:620,exit:450,fromX:0,fromY:36,toX:0,toY:-28}
];
const captions=[
 {at:0,text:"边际收益递减讨论的是额外一单位投入所带来的额外收益变小，它不必然意味着总存量下降，也不等于增长率下降。"},
 {at:8350,text:"瓶颈、容量与损耗会限制强化回路。"},
 {at:13750,text:"扩大存量，不保证永远能以相同速度增长。"}
];
const inputTimes=[450,1250,2050,2850,3650];
const outputValues=[10,7,5,3,1];
const queueTimes=[8750,9200,9650,10100,10550,11000,11450];
const passedTimes=[11050,12500];
function makeRect(group,x,y,w,h,fill,stroke="#543b64",sw=4,rx=10){
 const r=document.createElementNS(ns,"rect");
 for(const [k,v] of Object.entries({x,y,width:w,height:h,rx,fill,stroke,"stroke-width":sw}))r.setAttribute(k,v);
 group.appendChild(r);return r;
}
function makeText(group,x,y,text,size=18,fill="#fffdf8"){
 const t=document.createElementNS(ns,"text");
 t.setAttribute("x",x);t.setAttribute("y",y);t.setAttribute("text-anchor","middle");
 t.setAttribute("font-size",size);t.setAttribute("font-weight","950");t.setAttribute("fill",fill);
 t.textContent=text;group.appendChild(t);return t;
}
function makeInputTokens(){
 const g=$("inputTokens");g.innerHTML="";
 inputTimes.forEach((_,i)=>{
  const token=document.createElementNS(ns,"g");token.id="input"+i;
  makeRect(token,0,0,48,48,"#35b9c0","#543b64",4,11);
  makeText(token,24,31,"1",20);
  g.appendChild(token);
 });
}
function makeOutputTokens(){
 const g=$("outputTokens");g.innerHTML="";
 outputValues.forEach((v,i)=>{
  const token=document.createElementNS(ns,"g");token.id="output"+i;token.setAttribute("opacity","0");
  makeRect(token,0,0,72,54,"#82b94e","#543b64",4,13);
  makeText(token,36,35,"+"+v,20);
  g.appendChild(token);
 });
}
function makeQueueTokens(){
 const g=$("queueTokens");g.innerHTML="";
 queueTimes.forEach((_,i)=>{
  const token=document.createElementNS(ns,"g");token.id="queue"+i;
  makeRect(token,0,0,54,54,"#f29a5b","#543b64",4,12);
  makeText(token,27,35,String(i+1),16);
  g.appendChild(token);
 });
}
function makePassedTokens(){
 const g=$("passedTokens");g.innerHTML="";
 passedTimes.forEach((_,i)=>{
  const token=document.createElementNS(ns,"g");token.id="passed"+i;token.setAttribute("opacity","0");
  makeRect(token,0,0,50,50,"#82b94e","#543b64",4,12);
  g.appendChild(token);
 });
}
function initCurve(){
 const p=$("curveLine");const len=p.getTotalLength();
 p.dataset.len=len;p.style.strokeDasharray=String(len);p.style.strokeDashoffset=String(len);
 $("curveGlow").style.opacity=".14";
 [...$("chartPoints").children].forEach(n=>n.setAttribute("opacity","0"));
 [...$("chartLabels").children].forEach(n=>n.setAttribute("opacity","0"));
}
function sceneState(ms,s){
 const local=ms-s.a, total=s.b-s.a;
 const inn=smooth(local/s.enter);
 const out=s.exit>0?smooth((s.b-ms)/s.exit):1;
 const alpha=Math.min(inn,out);
 const moveInX=(1-inn)*s.fromX;
 const moveOutX=(1-out)*s.toX;
 const moveInY=(1-inn)*s.fromY;
 const moveOutY=(1-out)*s.toY;
 const el=$(s.id);
 el.style.opacity=String(alpha);
 el.style.transform=`translate(${moveInX+moveOutX}px, ${moveInY+moveOutY}px)`;
}
function updateScene1(ms){
 const machinePulse=1+0.018*Math.sin(ms/170);
 $("machine1").setAttribute("transform",`translate(0 0) scale(1 ${machinePulse})`);
 inputTimes.forEach((t,i)=>{
  const token=$("input"+i);
  const p=(ms-t)/850;
  if(p<=0){token.setAttribute("opacity","0");token.setAttribute("transform","translate(185 448)");}
  else if(p<1){
   const x=185+420*p;
   const y=452-12*Math.sin(p*Math.PI);
   token.setAttribute("opacity","1");
   token.setAttribute("transform",`translate(${x} ${y})`);
  }else{token.setAttribute("opacity","0");token.setAttribute("transform","translate(605 448)");}
  const op=(ms-(t+550))/450;
  const out=$("output"+i);
  if(op<=0){out.setAttribute("opacity","0");out.setAttribute("transform",`translate(1010 420)`);}
  else{
   const x=1005+i*82;
   const y=420-12*Math.sin(Math.min(1,op)*Math.PI);
   out.setAttribute("opacity",String(smooth(op)));
   out.setAttribute("transform",`translate(${x} ${y})`);
  }
 });
}
function updateScene2(ms){
 const local=ms-5750;
 const draw=smooth(local/1500);
 const p=$("curveLine"),len=Number(p.dataset.len);
 p.style.strokeDashoffset=String(len*(1-draw));
 const points=[...$("chartPoints").children], labels=[...$("chartLabels").children];
 points.forEach((n,i)=>{
  const v=smooth((local-(180+i*250))/330);
  n.setAttribute("opacity",String(v));
  labels[i].setAttribute("opacity",String(v));
  n.setAttribute("r",String(8+3*v));
 });
}
function updateScene3(ms){
 const local=ms-8350;
 $("leakDrops").style.opacity=String(.65+.35*Math.sin(ms/180));
 queueTimes.forEach((t,i)=>{
  const token=$("queue"+i);
  const p=(ms-t)/900;
  if(p<=0){token.setAttribute("opacity","0");token.setAttribute("transform","translate(160 486)");}
  else{
   const x=170+i*62+Math.min(1,p)*40;
   token.setAttribute("opacity",String(smooth(p)));
   token.setAttribute("transform",`translate(${x} 486)`);
  }
 });
 passedTimes.forEach((t,i)=>{
  const token=$("passed"+i);
  const p=(ms-t)/1250;
  if(p<=0){token.setAttribute("opacity","0");token.setAttribute("transform","translate(1060 488)");}
  else{
   const x=1060+Math.min(1,p)*190+i*68;
   token.setAttribute("opacity",String(smooth(p)));
   token.setAttribute("transform",`translate(${x} 488)`);
  }
 });
}
function updateScene4(ms){
 const local=ms-13750;
 ["summaryPill1","summaryPill2","summaryPill3"].forEach((id,i)=>{
  const g=$(id);
  if(!g)return;
  const v=smooth((local-(350+i*220))/420);
  g.setAttribute("opacity",String(v));
  g.setAttribute("transform",`translate(${(1-v)*26} 0)`);
 });
}
function syncBottleneckFrame(ms){
 const frame=$('bottleneckFrame');
 const def=sceneDefs[2];
 const active=ms>=def.a&&ms<=def.b;
 if(!active){frame.style.display='none';$('frame').classList.remove('bottleneck-active');return;}
 $('frame').classList.add('bottleneck-active');
 if(!frame.dataset.requested){
  frame.dataset.requested='1';
  frame.addEventListener('load',()=>syncBottleneckFrame(elapsed));
  frame.src='./bottleneck-scene-v2-embedded.html';
 }
 const inn=smooth((ms-def.a)/def.enter);
 const out=smooth((def.b-ms)/def.exit);
 frame.style.display='block';
 frame.style.opacity=String(Math.min(inn,out));
 frame.style.transform=`translate(${(1-inn)*def.fromX+(1-out)*def.toX}px, ${(1-inn)*def.fromY+(1-out)*def.toY}px)`;
 const api=frame.contentWindow&&frame.contentWindow.__bottleneckV1;
 if(api&&typeof api.sync==='function')api.sync(Math.max(0,Math.min(def.b-def.a,ms-def.a)));
}
function update(ms){
 sceneDefs.forEach(s=>sceneState(ms,s));
 updateScene1(ms);updateScene2(ms);updateScene3(ms);updateScene4(ms);syncBottleneckFrame(ms);
 const cap=captions.reduce((a,b)=>ms>=b.at?b:a,captions[0]);
 $("caption").textContent=cap.text;
 $("captionGroup").style.opacity=String(1-smooth((ms-(DURATION-450))/450));
 const sec=Math.floor(ms/1000),d=Math.floor((ms%1000)/100);
 $("time").textContent=`00:${String(sec).padStart(2,"0")}.${d} / 00:20.1`;
}
function tick(now){
 if(!paused){elapsed=Math.min(DURATION,now-start);update(elapsed);}
 if(elapsed<DURATION&&!paused)raf=requestAnimationFrame(tick);
}
$("pause").addEventListener("click",()=>{
 if(!paused){paused=true;$("pause").textContent="继续";cancelAnimationFrame(raf);}
 else{paused=false;start=performance.now()-elapsed;$("pause").textContent="暂停";raf=requestAnimationFrame(tick);}
});
$("restart").addEventListener("click",()=>{
 paused=false;elapsed=0;start=performance.now();$("pause").textContent="暂停";update(0);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
});
$("gridToggle").addEventListener("click",()=>{
 $("frame").classList.toggle("guides");
 $("gridToggle").textContent=$("frame").classList.contains("guides")?"隐藏对齐辅助线":"显示对齐辅助线";
});
window.addEventListener("load",()=>{
 makeInputTokens();makeOutputTokens();makeQueueTokens();makePassedTokens();initCurve();
 update(0);start=performance.now();raf=requestAnimationFrame(tick);
});
</script>
</body>
