<script>
(()=>{
 const D=19.408980,$=id=>document.getElementById(id),seek=$('seek'),clock=$('clock'),toggle=$('toggle'),key=$('key');
 const starts=[2.1,5.4,8.7],actionA=$('actA'),actionB=$('actB'),slots=[$('slot1'),$('slot2'),$('slot3')],steps=[$('step1'),$('step2'),$('step3')];
 const tokenA=$('tokenA'),tokenB=$('tokenB'),countA=$('countA'),countB=$('countB'),stockA=$('stockA'),stockB=$('stockB');
 let t=0,playing=true,last=0,raf=0;const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));const ease=v=>{v=clamp(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};const fmt=s=>'00:'+String(Math.floor(s)).padStart(2,'0')+'.'+String(Math.floor((s%1)*10));
 function render(s){t=clamp(s,0,D);let done=0,active=-1,phase=0;
  starts.forEach((at,i)=>{const p=t-at;if(p>=1.55)done=i+1;if(p>=0&&p<2.15){active=i;phase=p}});
  [actionA,actionB].forEach((g,i)=>{const activeHere=active>=0;const q=activeHere?Math.sin(Math.PI*clamp(phase/.62)):0;g.setAttribute('transform',`translate(385 ${i===0?190:420}) scale(${1+q*.06})`);g.querySelector('circle').setAttribute('filter',activeHere?'url(#glow)':'none')});
  let showA=false,showB=false;
  if(active>=0){const p=phase;const move=ease(clamp(p/1.05));const fadeA=1-clamp((p-1.5)/.55);const qA=move;tokenA.setAttribute('transform',`translate(${535+qA*520} 190)`);tokenA.setAttribute('opacity',String(p<1.05?1:p<1.5?1:fadeA));showA=p<2.05;
   const qB=ease(clamp(p/1.3));const targets=[985,1057,1129];tokenB.setAttribute('transform',`translate(${535+qB*(targets[active]-535)} 432)`);tokenB.setAttribute('opacity',String(p<1.55?1:0));showB=p<1.55;
  }else{tokenA.setAttribute('opacity','0');tokenB.setAttribute('opacity','0')}
  slots.forEach((g,i)=>{const on=done>i;g.setAttribute('fill',on?'url(#gold)':'#e9e1ec');g.setAttribute('stroke',on?'#a76b37':'none');g.setAttribute('stroke-width',on?'2':'0')});
  countA.textContent=String(done);countB.textContent=String(done);stockA.textContent='0';stockB.textContent='+'+done;
  steps.forEach((g,i)=>g.querySelector('circle').setAttribute('fill',done>i?'#83b85a':active===i?'#ef9a61':'#cfc4d6'));
  clock.textContent=fmt(t)+' / 00:19.4';seek.value=t;const k=ease(clamp((t-15.8)/.8));key.style.opacity=String(k);key.style.transform=`translateY(${12*(1-k)}px)`;
 }
 function tick(now){if(!playing)return;if(!last)last=now;const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;if(t>=D){t=D;playing=false;toggle.textContent='继续'}render(t);if(playing)raf=requestAnimationFrame(tick)}
 function play(){if(t>=D)t=0;playing=true;last=0;toggle.textContent='暂停';cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
 toggle.addEventListener('click',()=>{if(playing){playing=false;cancelAnimationFrame(raf);toggle.textContent='继续'}else play()});$('replay').addEventListener('click',()=>{t=0;render(0);play()});seek.addEventListener('input',()=>{t=Number(seek.value);render(t);if(playing)last=0});
 const params=new URLSearchParams(location.search),initial=Number(params.get('at')||0);if(params.has('pause')){playing=false;t=clamp(initial,0,D);render(t);toggle.textContent='继续'}else{render(0);raf=requestAnimationFrame(tick)}window.__cue06={sync(ms){render(ms/1000)},duration:D,render};
})();
</script></body></html>
