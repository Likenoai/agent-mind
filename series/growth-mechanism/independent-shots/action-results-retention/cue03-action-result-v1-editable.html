(()=>{
 const D=17.005714, $=id=>document.getElementById(id), stage=$('stage'),pulse=$('pulse'),result=$('result'),key=$('key'),seek=$('seek'),clock=$('clock'),toggle=$('toggle');
 const events=[2.15,6.15,10.15], resultStarts=[2.72,6.72,10.72], resultEnds=[5.45,9.45,13.45], badges=[$('e1'),$('e2'),$('e3')];

 const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
 const ease=v=>{v=clamp(v);return v<.5?4*v*v*v:1-Math.pow(-2*v+2,3)/2};
 const smooth=(a,b,x)=>ease(clamp((x-a)/(b-a)));

 function render(ms){t=clamp(ms,0,D);const s=t;

  events.forEach((at,i)=>{const p=s-at;if(p>=0&&p<1.05){const rise=clamp(p/.16),fall=1-clamp((p-.16)/.78);pulseAmt=Math.max(pulseAmt,Math.min(rise,fall))}if(s>=at&&s<resultEnds[i])active=i;});
  pulse.style.opacity=String(pulseAmt*.9);pulse.style.transform=`scale(${.68+pulseAmt*.58})`;
  let shown=-1,progress=0;for(let i=0;i<3;i++){if(s>=resultStarts[i]&&s<=resultEnds[i]){shown=i;progress=clamp((s-resultStarts[i])/(resultEnds[i]-resultStarts[i]));break}}
  if(shown>=0){const p=ease(progress);result.style.opacity=String(Math.min(1,progress*8,(1-progress)*8));result.style.transform=`translateX(${-150+150*p}px) scale(${.94+.06*p})`;result.style.borderColor=progress>.86?'#dce8d1':'#e6dacb';}

  const k=smooth(13.7,14.5,s);key.style.opacity=String(k);key.style.transform=`translateY(${12*(1-k)}px)`;
  clock.textContent=fmt(s)+' / 00:17.0';seek.value=s;
 }
 function tick(now){if(!playing)return;if(!last)last=now;const dt=Math.min(0.05,(now-last)/1000);last=now;t+=dt;if(t>=D){t=D;playing=false;toggle.textContent='继续'}render(t);if(playing)raf=requestAnimationFrame(tick)}
 function play(){if(t>=D)t=0;playing=true;last=0;toggle.textContent='暂停';cancelAnimationFrame(raf);raf=requestAnimationFrame(tick)}
 toggle.addEventListener('click',()=>{if(playing){playing=false;cancelAnimationFrame(raf);toggle.textContent='继续'}else play()});
 $('replay').addEventListener('click',()=>{t=0;render(0);play()});seek.addEventListener('input',()=>{t=Number(seek.value);render(t);if(playing){last=0}});
 const params=new URLSearchParams(location.search);const initial=Number(params.get('at')||0);if(params.has('pause')){playing=false;t=clamp(initial,0,D);render(t);toggle.textContent='继续'}else{render(0);raf=requestAnimationFrame(tick)}
 window.__cue03={sync(ms){render(ms/1000)},duration:D,render};
})();
</script>
