<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>维护、更新与淘汰｜独立镜头 V6</title>
<style>
:root{--ink:#39234f;--muted:#8b7a98;--paper:#fbf8f0;--teal:#35b9c0;--coral:#ef7965;--green:#82b94e;--purple:#9273b8;--gold:#e6b93e;--orange:#f29a5b;--cream:#fffdf8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#e9e4dc;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}
body{display:grid;place-items:center;overflow:hidden}
.frame{width:min(100vw,177.777vh);height:min(100vh,56.25vw);aspect-ratio:16/9;position:relative;background:var(--paper);overflow:hidden;box-shadow:0 16px 50px rgba(40,25,58,.15)}
svg{display:block;width:100%;height:100%}
.small{font-size:14px;font-weight:900;letter-spacing:2px;fill:#8c7b9a}
.title{font-size:39px;font-weight:950;fill:var(--ink)}
.subtitle{font-size:19px;font-weight:800;fill:#7d6b8d}
.section{font-size:15px;font-weight:950;letter-spacing:1px;fill:#8b7a98}
.label{font-size:17px;font-weight:900;fill:var(--ink)}
.micro{font-size:13px;font-weight:850;fill:#8b7a98}
.metric{font-size:17px;font-weight:950;fill:var(--ink);font-variant-numeric:tabular-nums}
.caption-text{font-size:22px;font-weight:900;fill:var(--ink)}
.panel{fill:#fffdf8;stroke:#e8dfd2;stroke-width:2}
.controls{position:absolute;left:3%;right:3%;bottom:1.2%;display:flex;align-items:center;gap:12px;z-index:5;padding:7px 12px;border-radius:18px;background:rgba(251,248,240,.97);box-shadow:0 4px 14px rgba(57,35,79,.10);backdrop-filter:blur(4px)}
.controls button{border:1.5px solid rgba(57,35,79,.25);border-radius:999px;background:#fffdf8;color:var(--ink);padding:8px 16px;font-size:13px;font-weight:900;cursor:pointer;white-space:nowrap}
.controls button:hover{background:#f2ebdf}
.time{font-size:13px;font-weight:900;color:#8b7a98;font-variant-numeric:tabular-nums;white-space:nowrap}
#seek{flex:1;min-width:80px;accent-color:#9273b8;cursor:pointer}
.caption-bg{fill:#fffdf8;stroke:#e8dfd2;stroke-width:1.6}
.route{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:9 13;opacity:.62}
.route.maint{stroke:#82b94e}
.route.update{stroke:#35b9c0}
.route.retire{stroke:#ef7965}
.route.intake{stroke:#a997bc;opacity:.46}
.token{pointer-events:none}
.scene-enter{opacity:0;transform:translateY(18px)}
@media(prefers-reduced-motion:reduce){.scene-enter{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="frame" id="frame">
<svg id="stage" viewBox="0 0 1600 900" role="img" aria-label="存量中的部件经过识别后，分别进入维护、更新和淘汰路径；维护与更新后的部件回到有效存量，淘汰的部件退出系统">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf7"/><stop offset=".58" stop-color="#fbf8ef"/><stop offset="1" stop-color="#f0eee5"/></linearGradient>
  <radialGradient id="warmGlow"><stop stop-color="#f5d77b" stop-opacity=".22"/><stop offset="1" stop-color="#f5d77b" stop-opacity="0"/></radialGradient>
  <radialGradient id="coolGlow"><stop stop-color="#83d4ce" stop-opacity=".2"/><stop offset="1" stop-color="#83d4ce" stop-opacity="0"/></radialGradient>
  <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fffdf8"/><stop offset=".5" stop-color="#ded6e5"/><stop offset="1" stop-color="#b9acc8"/></linearGradient>
  <linearGradient id="machineGold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe27a"/><stop offset="1" stop-color="#e7ae2e"/></linearGradient>
  <linearGradient id="belt" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#81708f"/><stop offset="1" stop-color="#514064"/></linearGradient>
  <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9bf0e9"/><stop offset="1" stop-color="#27aeb6"/></linearGradient>
  <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c8ee91"/><stop offset="1" stop-color="#75ad43"/></linearGradient>
  <linearGradient id="coralGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb2a0"/><stop offset="1" stop-color="#e56555"/></linearGradient>
  <filter id="shadow" x="-25%" y="-25%" width="150%" height="165%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#39234f" flood-opacity=".13"/></filter>
  <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#39234f" flood-opacity=".16"/></filter>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrowMaint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#82b94e"/></marker>
  <marker id="arrowUpdate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#35b9c0"/></marker>
  <marker id="arrowRetire" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10Z" fill="#ef7965"/></marker>
  <clipPath id="rackClip"><rect x="108" y="367" width="260" height="230" rx="22"/></clipPath>
  <clipPath id="beltClip"><rect x="350" y="468" width="178" height="76" rx="22"/></clipPath>

  <!-- Same-size module states: only condition and attached components change. -->
  <g id="module-worn">
    <rect x="10" y="9" width="76" height="46" rx="12" fill="url(#machineGold)" stroke="#543b64" stroke-width="4"/>
    <path d="M17 16 H79 V47 H17Z" fill="#f4c447" stroke="#b47c2b" stroke-width="2"/>
    <rect x="29" y="18" width="39" height="28" rx="6" fill="#45364f" stroke="#7b6a88" stroke-width="3"/>
    <circle cx="49" cy="32" r="10" fill="#d9d0bf" stroke="#342640" stroke-width="3"/>
    <path d="M49 23 V41 M40 32 H58 M43 26 L55 38 M55 26 L43 38" stroke="#66586f" stroke-width="3" stroke-linecap="round"/>
    <path d="M6 25 C0 25 0 39 7 39" fill="none" stroke="#543b64" stroke-width="5" stroke-linecap="round"/>
    <path d="M15 12 L26 9 M71 53 L80 49 M17 48 L24 53" stroke="#a45c43" stroke-width="3" stroke-linecap="round"/>
    <path d="M74 13 L82 20 M78 9 L85 16" stroke="#ef7965" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="18" cy="21" r="2.5" fill="#fff1b9"/><circle cx="78" cy="42" r="2.5" fill="#fff1b9"/>
  </g>
  <g id="module-outdated">
    <rect x="10" y="9" width="76" height="46" rx="12" fill="#edc15a" stroke="#543b64" stroke-width="4"/>
    <path d="M17 16 H79 V47 H17Z" fill="#e5bd70" stroke="#a77d48" stroke-width="2"/>
    <rect x="27" y="17" width="43" height="30" rx="6" fill="#51475e" stroke="#7b6a88" stroke-width="3"/>
    <circle cx="49" cy="32" r="11" fill="#c9c0ad" stroke="#342640" stroke-width="3"/>
    <path d="M49 23 V41 M40 32 H58" stroke="#756a74" stroke-width="3" stroke-linecap="round"/>
    <path d="M6 25 C0 25 0 39 7 39" fill="none" stroke="#543b64" stroke-width="5" stroke-linecap="round"/>
    <path d="M17 12 L26 9 M71 53 L80 49" stroke="#9a7b4c" stroke-width="3" stroke-linecap="round"/>
    <rect x="31" y="20" width="36" height="8" rx="3" fill="#8f8294" opacity=".55"/>
    <path d="M74 13 L82 20 M78 9 L85 16" stroke="#d1a45b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <g id="module-maintained">
    <rect x="10" y="9" width="76" height="46" rx="12" fill="url(#machineGold)" stroke="#543b64" stroke-width="4"/>
    <path d="M17 16 H79 V47 H17Z" fill="#ffd65c" stroke="#b47c2b" stroke-width="2"/>
    <rect x="29" y="18" width="39" height="28" rx="6" fill="#45364f" stroke="#7b6a88" stroke-width="3"/>
    <circle cx="49" cy="32" r="10" fill="#f2d47b" stroke="#342640" stroke-width="3"/>
    <path d="M49 23 V41 M40 32 H58 M43 26 L55 38 M55 26 L43 38" stroke="#66586f" stroke-width="3" stroke-linecap="round"/>
    <path d="M6 25 C0 25 0 39 7 39" fill="none" stroke="#543b64" stroke-width="5" stroke-linecap="round"/>
    <path d="M18 13 L26 11 M72 52 L80 48" stroke="#fff7d1" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M88 8 L91 1 M92 13 L99 11 M88 18 L93 24" stroke="#82b94e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="17" cy="18" r="2.5" fill="#fff"/><circle cx="77" cy="43" r="2.5" fill="#fff"/>
  </g>
  <g id="module-upgraded">
    <rect x="10" y="9" width="76" height="46" rx="12" fill="url(#machineGold)" stroke="#543b64" stroke-width="4"/>
    <path d="M17 16 H79 V47 H17Z" fill="#ffd65c" stroke="#b47c2b" stroke-width="2"/>
    <rect x="25" y="18" width="37" height="28" rx="6" fill="#45364f" stroke="#7b6a88" stroke-width="3"/>
    <circle cx="43" cy="32" r="9" fill="#f2d47b" stroke="#342640" stroke-width="3"/>
    <path d="M43 24 V40 M35 32 H51" stroke="#66586f" stroke-width="3" stroke-linecap="round"/>
    <path d="M6 25 C0 25 0 39 7 39" fill="none" stroke="#543b64" stroke-width="5" stroke-linecap="round"/>
    <rect x="59" y="16" width="29" height="31" rx="5" fill="url(#tealGrad)" stroke="#315568" stroke-width="3"/>
    <path d="M65 23 H81 M65 29 H81 M65 35 H75 M70 17 V12 M78 17 V12" stroke="#155b6a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="66" cy="41" r="2.5" fill="#fff36a"/><circle cx="81" cy="41" r="2.5" fill="#fff36a"/>
    <path d="M91 8 L94 1 M95 14 L102 12 M91 20 L96 26" stroke="#35b9c0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g id="module-failed">
    <rect x="10" y="9" width="76" height="46" rx="12" fill="#e7b65b" stroke="#543b64" stroke-width="4"/>
    <path d="M17 16 H79 V47 H17Z" fill="#d7a14e" stroke="#9a6c39" stroke-width="2"/>
    <rect x="29" y="18" width="39" height="28" rx="6" fill="#45364f" stroke="#7b6a88" stroke-width="3"/>
    <circle cx="49" cy="32" r="10" fill="#b7a9a1" stroke="#342640" stroke-width="3"/>
    <path d="M43 26 L55 38 M55 26 L43 38" stroke="#ef7965" stroke-width="4" stroke-linecap="round"/>
    <path d="M6 25 C0 25 0 39 7 39" fill="none" stroke="#543b64" stroke-width="5" stroke-linecap="round"/>
    <path d="M17 12 L26 9 M70 53 L80 49 M18 48 L24 53" stroke="#9a624e" stroke-width="3" stroke-linecap="round"/>
    <path d="M85 8 Q98 0 95 13 Q93 18 87 18" fill="none" stroke="#8c7b8b" stroke-width="3" stroke-linecap="round"/>
    <path d="M90 5 L98 1" stroke="#8c7b8b" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<ellipse cx="360" cy="470" rx="650" ry="430" fill="url(#warmGlow)"/>
<ellipse cx="1280" cy="470" rx="520" ry="430" fill="url(#coolGlow)"/>

<!-- Header -->
<g id="header" class="scene-enter">
  <text class="small" x="88" y="62">STOCK MANAGEMENT / 03</text>
  <text class="title" x="88" y="116">让存量保持有效</text>
  <text class="subtitle" x="90" y="153">不是留下越多越好，而是维护有效存量</text>
  <g transform="translate(1320 72)">
    <rect width="180" height="42" rx="21" fill="#fffdf8" stroke="#e8dfd2" stroke-width="2"/>
    <circle cx="22" cy="21" r="6" fill="#f29a5b"/>
    <text x="42" y="27" font-size="15" font-weight="900" fill="#8b7a98">动态示意</text>
  </g>
</g>

<!-- Main system panel -->
<g id="system" class="scene-enter">
  <rect x="65" y="190" width="1470" height="575" rx="34" class="panel" filter="url(#shadow)"/>

  <!-- Zone labels -->
  <g transform="translate(125 245)">
    <circle cx="10" cy="0" r="7" fill="#9273b8"/>
    <text class="section" x="29" y="5">EXISTING STOCK / 已有存量</text>
  </g>
  <g transform="translate(520 245)">
    <circle cx="10" cy="0" r="7" fill="#e6b93e"/>
    <text class="section" x="29" y="5">DIAGNOSE / 识别与分流</text>
  </g>
  <g transform="translate(950 245)">
    <circle cx="10" cy="0" r="7" fill="#35b9c0"/>
    <text class="section" x="29" y="5">THREE FATES / 三种处理结果</text>
  </g>

  <!-- Return routes: green and teal return to stock; coral ends at recycling -->
  <g id="routes">
    <path class="route maint" marker-end="url(#arrowMaint)" d="M1260 344 C1350 344 1400 310 1465 310 L1465 218 L216 218 C216 270 216 350 216 424" opacity=".56"/>
    <path class="route update" marker-end="url(#arrowUpdate)" d="M1260 514 C1350 514 1410 600 1490 600 L1490 742 L216 742 C216 690 216 560 216 494" opacity=".56"/>

    <path class="route intake" d="M216 494 C340 494 405 500 520 500"/>

    <path class="route retire" marker-end="url(#arrowRetire)" d="M1260 684 C1310 684 1350 684 1415 684"/>
    <text x="720" y="286" font-size="13" font-weight="900" fill="#6a9d43">恢复后回库</text>
    <text x="720" y="728" font-size="13" font-weight="900" fill="#1599a2">升级后回库</text>
    <text x="1300" y="660" font-size="13" font-weight="900" fill="#d86351">不再返回</text>
  </g>

  <!-- Inventory rack -->
  <g id="rack" filter="url(#softShadow)">
    <rect x="105" y="360" width="260" height="242" rx="22" fill="#f6f0e4" stroke="#543b64" stroke-width="7"/>
    <rect x="121" y="376" width="228" height="210" rx="12" fill="#fffaf0" stroke="#b8a9c5" stroke-width="3"/>
    <path d="M120 444 H350 M120 515 H350" stroke="#543b64" stroke-width="9" stroke-linecap="round"/>
    <path d="M135 384 V582 M335 384 V582" stroke="#e3b43f" stroke-width="10" stroke-linecap="round"/>
    <g fill="#d7cddd" stroke="#543b64" stroke-width="3">
      <circle cx="135" cy="398" r="5"/><circle cx="335" cy="398" r="5"/>
      <circle cx="135" cy="570" r="5"/><circle cx="335" cy="570" r="5"/>
    </g>
    <rect x="130" y="600" width="210" height="34" rx="17" fill="#e9e0ee" stroke="#9c87ad" stroke-width="2"/>
    <text x="235" y="622" text-anchor="middle" font-size="14" font-weight="950" fill="#6f5a82">有效存量</text>
  </g>
  <g id="rackSlot1" transform="translate(166 392)"><use href="#module-worn" width="100" height="64"/></g>
  <g id="rackSlot2" transform="translate(166 462)"><use href="#module-outdated" width="100" height="64"/></g>
  <g id="rackSlot3" transform="translate(166 532)"><use href="#module-failed" width="100" height="64"/></g>
  <g id="rackEmpty" opacity="0">
    <rect x="158" y="532" width="112" height="57" rx="10" fill="none" stroke="#c7b9d0" stroke-width="3" stroke-dasharray="6 7"/>
    <text x="214" y="567" text-anchor="middle" font-size="13" font-weight="900" fill="#a494b0">空位</text>
  </g>

  <!-- Intake conveyor -->
  <g id="intakeBelt">
    <rect x="350" y="468" width="178" height="76" rx="22" fill="#392b4c" stroke="#2e203f" stroke-width="4"/>
    <rect x="360" y="476" width="158" height="60" rx="16" fill="url(#belt)"/>
    <g clip-path="url(#beltClip)">
      <path id="beltDashes" d="M360 506 H520" stroke="#c5b8d0" stroke-width="4" stroke-linecap="round" stroke-dasharray="12 18" opacity=".7"/>
    </g>
    <g fill="#d6cddd" stroke="#392b4c" stroke-width="3">
      <circle cx="372" cy="548" r="10"/><circle cx="420" cy="548" r="10"/><circle cx="468" cy="548" r="10"/><circle cx="510" cy="548" r="10"/>
    </g>
  </g>

  <!-- Sorting machine -->
  <g id="sorter" filter="url(#shadow)">
    <rect x="520" y="365" width="232" height="252" rx="28" fill="url(#machineGold)" stroke="#543b64" stroke-width="8"/>
    <rect x="542" y="386" width="188" height="210" rx="20" fill="#fff8e8" stroke="#543b64" stroke-width="5"/>
    <rect x="562" y="405" width="148" height="82" rx="14" fill="#273746" stroke="#65527b" stroke-width="4"/>
    <text x="636" y="430" text-anchor="middle" font-size="12" font-weight="900" fill="#b9d8d1" letter-spacing="1">DIAGNOSIS</text>
    <circle id="scanRing" cx="636" cy="458" r="18" fill="none" stroke="#35b9c0" stroke-width="4" opacity=".7"/>
    <circle cx="636" cy="458" r="5" fill="#e6b93e"/>
    <g id="sortGear" transform="translate(636 535)">
      <circle r="33" fill="#e9dfc8" stroke="#543b64" stroke-width="5"/>
      <circle r="22" fill="#f4c33d" stroke="#543b64" stroke-width="4"/>
      <g stroke="#543b64" stroke-width="7" stroke-linecap="round">
        <path d="M0 -33 V-25 M0 25 V33 M-33 0 H-25 M25 0 H33 M-23 -23 L-17 -17 M17 17 L23 23 M23 -23 L17 -17 M-17 17 L-23 23"/>
      </g>
      <circle r="8" fill="#35b9c0" stroke="#543b64" stroke-width="3"/>
    </g>
    <g id="sortGate" transform="translate(720 505)">
      <circle r="13" fill="#543b64"/>
      <path id="gateArm" d="M0 0 L-8 -56" stroke="#ef7965" stroke-width="12" stroke-linecap="round"/>
      <circle r="5" fill="#fffdf8"/>
    </g>
    <g id="sortPorts">
      <circle cx="748" cy="446" r="10" fill="#fffdf8" stroke="#82b94e" stroke-width="5"/>
      <circle cx="748" cy="504" r="10" fill="#fffdf8" stroke="#35b9c0" stroke-width="5"/>
      <circle cx="748" cy="562" r="10" fill="#fffdf8" stroke="#ef7965" stroke-width="5"/>
    </g>
    <text x="636" y="642" text-anchor="middle" font-size="14" font-weight="950" fill="#705b7f">识别状态 · 分配路径</text>
  </g>

  <!-- Maintenance lane -->
  <g id="maintLane">
    <rect x="900" y="270" width="570" height="145" rx="24" fill="#f3f8e9" stroke="#d7e7bf" stroke-width="2"/>
    <rect x="925" y="282" width="190" height="38" rx="19" fill="#fffdf8" stroke="#82b94e" stroke-width="2"/>

    <g id="maintMachine" transform="translate(1060 316)">
      <rect x="0" y="8" width="225" height="83" rx="18" fill="url(#metal)" stroke="#543b64" stroke-width="6"/>
      <rect x="12" y="20" width="201" height="57" rx="12" fill="#fffdf8" stroke="#a997bc" stroke-width="3"/>
      <path d="M25 72 H200" stroke="#543b64" stroke-width="5" stroke-linecap="round"/>
      <rect x="22" y="0" width="182" height="18" rx="9" fill="url(#machineGold)" stroke="#543b64" stroke-width="4"/>
      <circle cx="196" cy="9" r="6" fill="#82b94e" stroke="#543b64" stroke-width="2"/>
      <g id="brushHead" transform="translate(111 20)">
        <rect x="-28" y="-28" width="56" height="20" rx="8" fill="#e6b93e" stroke="#543b64" stroke-width="4"/>
        <path d="M-23 -8 L-18 7 M-12 -8 L-8 7 M0 -8 V8 M12 -8 L8 7 M23 -8 L18 7" stroke="#7655a2" stroke-width="4" stroke-linecap="round"/>
        <circle cx="0" cy="-18" r="5" fill="#35b9c0"/>

      <g fill="#82b94e"><circle cx="35" cy="10" r="4"/><circle cx="48" cy="10" r="4"/><circle cx="61" cy="10" r="4"/></g>

    <text x="1320" y="352" font-size="13" font-weight="900" fill="#6a9d43">清洁 · 修补 · 恢复可用</text>

  </g>

  <!-- Update lane -->
  <g id="updateLane">
    <rect x="900" y="440" width="570" height="145" rx="24" fill="#eaf8f7" stroke="#c7e9e5" stroke-width="2"/>
    <rect x="925" y="452" width="190" height="38" rx="19" fill="#fffdf8" stroke="#35b9c0" stroke-width="2"/>
    <circle cx="945" cy="471" r="5" fill="#35b9c0"/>
    <text x="963" y="477" font-size="17" font-weight="950" fill="#168f98">更新｜改善适用性</text>
    <g id="updateMachine" transform="translate(1060 485)">
      <rect x="0" y="8" width="225" height="83" rx="18" fill="url(#metal)" stroke="#543b64" stroke-width="6"/>
      <rect x="12" y="20" width="201" height="57" rx="12" fill="#fffdf8" stroke="#a997bc" stroke-width="3"/>

    <g id="retireMachine" transform="translate(1060 654)">

      <g id="recycleMark" transform="translate(56 70)" fill="none" stroke="#fff7ed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

    <path d="M0 -5 L1 -1 L5 0 L1 1 L0 5 L-1 1 L-5 0 L-1 -1Z"/>

    <circle r="5" fill="#82b94e"/><circle r="5" fill="#35b9c0"/><circle r="5" fill="#ef7965"/>

  <g id="burdenCard" transform="translate(120 690)">
    <rect width="420" height="42" rx="21" fill="#f6f1f8" stroke="#cbbbd8" stroke-width="2"/>

    <rect x="178" y="15" width="190" height="12" rx="6" fill="#e1d9e8"/>

  <span class="time" id="time">00.00 / 20.43 s</span>

<script>
(() => {
  'use strict';
  const DURATION = 20427.755;
  const SVG_NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const clamp = (v,a=0,b=1) => Math.max(a,Math.min(b,v));
  const smooth = v => {v=clamp(v);return v*v*(3-2*v)};
  const lerp = (a,b,p) => a+(b-a)*p;
  let elapsed=0,startAt=performance.now(),paused=false,raf=0,scrubbing=false;

  const pathIds=['intakeMaint','sortMaint','branchMaint','maintExit','maintReturn','intakeUpdate','sortUpdate','branchUpdate','updateExit','updateReturn','intakeRetire','sortRetire','branchRetire','retireDrop'];
  const paths={};
  pathIds.forEach(id=>{const p=$(id);paths[id]={node:p,length:p.getTotalLength()};});

  function pointOn(id,p){
    const item=paths[id],pt=item.node.getPointAtLength(item.length*clamp(p));
    return {x:pt.x,y:pt.y};
  }
  function place(node,x,y,opacity=1){
    node.setAttribute('transform','translate('+x.toFixed(2)+' '+y.toFixed(2)+')');
    node.setAttribute('opacity',String(opacity));
    node.setAttribute('visibility',opacity>0.01?'visible':'hidden');
  }
  function moveOn(node,pathId,start,end,t,opacity=1){
    const p=smooth((t-start)/(end-start));
    const pt=pointOn(pathId,p);
    place(node,pt.x-50,pt.y-32,opacity);
  }
  function showState(node,state){
    node.querySelectorAll('[data-state]').forEach(el=>{el.style.display=el.getAttribute('data-state')===state?'':'none';});
  }
  function animateItem(node,t,plan){
    if(t<plan.intake[0]){place(node,0,0,0);return;}
    if(t<plan.intake[1]){moveOn(node,plan.intakePath,plan.intake[0],plan.intake[1],t);return;}
    if(plan.sort&&t<plan.sort[1]){moveOn(node,plan.sortPath,plan.sort[0],plan.sort[1],t);return;}
    if(t<plan.branch[1]){moveOn(node,plan.branchPath,plan.branch[0],plan.branch[1],t);return;}
    if(t<plan.process[1]){place(node,plan.hold.x-50,plan.hold.y-32);return;}
    if(plan.exit && t<plan.exit[1]){moveOn(node,plan.exitPath,plan.exit[0],plan.exit[1],t);return;}
    if(plan.return && t<plan.return[1]){moveOn(node,plan.returnPath,plan.return[0],plan.return[1],t);return;}
    if(plan.drop && t<plan.drop[1]){const p=smooth((t-plan.drop[0])/(plan.drop[1]-plan.drop[0])),pt=pointOn(plan.dropPath,(t-plan.drop[0])/(plan.drop[1]-plan.drop[0]));node.setAttribute('transform','translate('+(pt.x-50)+' '+(pt.y-32)+') translate(50 32) scale('+(1-.58*p)+') translate(-50 -32)');node.setAttribute('opacity',String(1-p));node.setAttribute('visibility','visible');return;}
    place(node,0,0,0);
  }

  const plans={
    maint:{
      intakePath:'intakeMaint',intake:[1400,2750],
      sortPath:'sortMaint',sort:[2750,3450],
      branchPath:'branchMaint',branch:[3450,4700],
      process:[4700,6500],hold:{x:1112,y:344},
      exitPath:'maintExit',exit:[6500,7100],
      returnPath:'maintReturn',return:[7100,10000]
    },
    update:{
      intakePath:'intakeUpdate',intake:[3900,5250],
      sortPath:'sortUpdate',sort:[5250,5950],
      branchPath:'branchUpdate',branch:[5950,7400],
      process:[7400,9300],hold:{x:1112,y:514},
      exitPath:'updateExit',exit:[9300,9900],
      returnPath:'updateReturn',return:[9900,12900]
    },
    retire:{
      intakePath:'intakeRetire',intake:[6900,8250],
      sortPath:'sortRetire',sort:[8250,8950],
      branchPath:'branchRetire',branch:[8950,10400],
      process:[10400,11100],hold:{x:1112,y:684},
      dropPath:'retireDrop',drop:[11100,12200]
    }
  };

  function animateMachines(t){
    const m=clamp((t-4700)/1800),u=clamp((t-7400)/1900),r=clamp((t-10400)/700);
    $('brushHead').setAttribute('transform','translate(52 20) rotate('+(m*540)+' 0 0)');
    $('maintCheck').setAttribute('opacity',String(smooth((t-6150)/350)));
    $('updateCheck').setAttribute('opacity',String(smooth((t-8950)/350)));
    $('robotLeft').setAttribute('transform','translate(62 19) rotate('+(Math.sin(u*Math.PI*2)*15)+' 0 0)');
    $('robotRight').setAttribute('transform','translate(163 19) rotate('+(-Math.sin(u*Math.PI*2)*15)+' 0 0)');
    const chipP=smooth((t-8200)/650);
    $('upgradeChip').setAttribute('transform','translate(0 '+(45*chipP)+')');
    $('recycleLid').setAttribute('transform','rotate('+(r*42)+' 0 48)');
    $('recycleMark').setAttribute('transform','translate(56 70) rotate('+(r*260)+')');
    $('retireStamp').setAttribute('opacity',String(smooth((t-11600)/400)));
    $('sortGear').setAttribute('transform','translate(636 535) rotate('+(t*.045)+')');
    $('scanRing').setAttribute('r',String(18+5*Math.sin(t*.012)));
    $('scanRing').setAttribute('opacity',String(.48+.4*Math.sin(t*.012)));
    let gateAngle=-56;
    if(t>=2750&&t<3450)gateAngle=-56;
    else if(t>=5250&&t<5950)gateAngle=0;
    else if(t>=8250&&t<8950)gateAngle=56;
    $('gateArm').setAttribute('transform','rotate('+gateAngle+')');
    $('beltDashes').setAttribute('stroke-dashoffset',String(-t*.035));
    $('intakeBelt').querySelectorAll('circle').forEach((c,i)=>c.setAttribute('transform','rotate('+(t*.08)+' '+[372,420,468,510][i]+' 548)'));
    $('burdenBar').setAttribute('width',String(165-97*smooth((t-12200)/1600)));
    $('rackSlot1').setAttribute('opacity',t<1400?1:t<10000?0:1);
    $('rackSlot2').setAttribute('opacity',t<3900?1:t<12900?0:1);
    $('rackSlot3').setAttribute('opacity',t<6900?1:0);
    $('rackEmpty').setAttribute('opacity',String(smooth((t-11900)/900)));
    if(t>=10000)showRackState('rackSlot1','module-maintained');
    if(t>=12900)showRackState('rackSlot2','module-upgraded');
  }
  function showRackState(id,symbol){
    const g=$(id);if(g.dataset.state===symbol)return;g.dataset.state=symbol;g.replaceChildren();
    const use=document.createElementNS(SVG_NS,'use');
    use.setAttribute('href','#'+symbol);use.setAttribute('width','100');use.setAttribute('height','64');
    g.appendChild(use);
  }
  function animateParticles(t){
    const dust=$('dustParticles').querySelectorAll('circle');
    dust.forEach((c,i)=>{
      const phase=clamp((t-4800)/1700);
      const active=t>=4800&&t<=6500;
      const a=(i*1.37)%1;
      c.setAttribute('cx',String(1100+Math.sin(t*.009+i)*32+a*30));
      c.setAttribute('cy',String(345-((t*.035+i*21)%75)));
      c.setAttribute('r',String(2.5+(i%3)));
      c.setAttribute('opacity',String(active?Math.sin(Math.PI*phase)*.82:0));
    });
    const sparks=$('upgradeSparks').querySelectorAll('path');
    sparks.forEach((p,i)=>{
      const active=t>=8200&&t<=9300;
      const angle=t*.006+i*2.1;
      p.setAttribute('transform','translate('+(1130+Math.cos(angle)*(34+i*8))+' '+(500+Math.sin(angle)*(24+i*6))+') rotate('+(angle*40)+')');
      p.setAttribute('opacity',String(active?(.45+.5*Math.sin(t*.025+i)):0));
    });
    const dots=$('flowDots').querySelectorAll('circle');
    const dotPaths=['maintReturn','updateReturn','retireDrop'];
    dots.forEach((c,i)=>{
      const p=(t*.00011+i*.33)%1,pt=pointOn(dotPaths[i],p);
      c.setAttribute('cx',String(pt.x));c.setAttribute('cy',String(pt.y));
      c.setAttribute('opacity',String(i===0?(t>7100&&t<10000?.8:0):i===1?(t>9900&&t<12900?.8:0):(t>11100&&t<12200?.8:0)));
    });
  }
  const captions=[
    [0,4000,'存量不是无损保存的。'],
    [4000,9000,'遗忘、技能退化、工具过时和环境变化，会削弱它的有效性。'],
    [9000,15800,'维护减少损耗，更新改善适用性，淘汰停止维持不值得留下的部分。'],
    [15800,DURATION,'必要时，少保留反而能减轻未来负担。']
  ];
  function update(t){
    elapsed=clamp(t,0,DURATION);
    animateItem($('movingMaint'),elapsed,plans.maint);
    animateItem($('movingUpdate'),elapsed,plans.update);
    animateItem($('movingRetire'),elapsed,plans.retire);
    showState($('movingMaint'),elapsed>=6500?'maintained':'worn');
    showState($('movingUpdate'),elapsed>=9300?'upgraded':'outdated');
    animateMachines(elapsed);
    animateParticles(elapsed);
    const cap=captions.find(c=>elapsed>=c[0]&&elapsed<c[1])||captions[captions.length-1];
    $('caption').textContent=cap[2];
    $('time').textContent=(elapsed/1000).toFixed(2)+' / 20.43 s';
    $('seek').value=String(elapsed);
    $('debug').textContent='t='+elapsed.toFixed(0);
  }
  function tick(now){
    if(!paused&&!scrubbing){elapsed=Math.min(DURATION,now-startAt);update(elapsed);if(elapsed>=DURATION){paused=true;$('pause').textContent='重播';}}
    if(!paused&&!scrubbing)raf=requestAnimationFrame(tick);
  }
  function play(){
    if(elapsed>=DURATION)elapsed=0;
    paused=false;startAt=performance.now()-elapsed;$('pause').textContent='暂停';
    cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
  }
  $('pause').addEventListener('click',()=>{
    if(!paused){paused=true;cancelAnimationFrame(raf);$('pause').textContent='继续';}
    else play();
  });
  $('restart').addEventListener('click',()=>{elapsed=0;update(0);play();});
  $('seek').addEventListener('input',e=>{scrubbing=true;paused=true;cancelAnimationFrame(raf);update(Number(e.target.value));$('pause').textContent='继续';});
  $('seek').addEventListener('change',()=>{scrubbing=false;startAt=performance.now()-elapsed;});
  window.__maintenanceV6={seek(ms){paused=true;scrubbing=false;cancelAnimationFrame(raf);update(ms);$('pause').textContent='继续';},play,pause(){paused=true;cancelAnimationFrame(raf);},getState(){return {elapsed,maintenanceReturned:elapsed>=10000,updateReturned:elapsed>=12900,retired:elapsed>=12200,remainingStock:elapsed>=12900?2:3,duration:DURATION};}};
  window.addEventListener('load',()=>{update(0);play();});
})();
</script>
