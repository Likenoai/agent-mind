<title>增长的流入与流出｜独立镜头</title>
<style>
:root{--ink:#39234f;--muted:#8b7a98;--paper:#fbf8f0;--teal:#35b9c0;--coral:#ef7965;--green:#82b94e;--blue:#65a9d9;--purple:#9273b8}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#e9e4dc;font-family:system-ui,"Microsoft YaHei",sans-serif;color:var(--ink)}
body{display:grid;place-items:center;overflow:hidden}
body.embed-mode{background:transparent}
body.embed-mode .frame{box-shadow:none}
body.embed-mode .controls,body.embed-mode .grid-toggle,body.embed-mode #caption-group{display:none!important}
.frame{width:min(100vw,177.777vh);height:min(100vh,56.25vw);aspect-ratio:16/9;position:relative;background:var(--paper);overflow:hidden;box-shadow:0 16px 50px rgba(40,25,58,.15)}
svg{display:block;width:100%;height:100%}
.small{font-weight:850;fill:#8c7b9a;font-size:14px;letter-spacing:2px}
.title{font-size:37px;font-weight:950;fill:var(--ink)}
.subtitle{font-size:19px;font-weight:850;fill:#705b82}
.state-pill{fill:#fffdf8;stroke-width:3}
.state-text{font-size:20px;font-weight:950}
.flow-legend{font-size:15px;font-weight:850;fill:#705f7f}
.caption{font-size:25px;font-weight:950;fill:var(--ink)}
.note{font-size:15px;font-weight:750;fill:#8b7a98}
.controls{position:absolute;right:2.1%;bottom:2%;display:flex;align-items:center;gap:9px;z-index:5;padding:4px 8px;border-radius:28px;background:rgba(251,248,240,.95);box-shadow:0 3px 12px rgba(57,35,79,.08);backdrop-filter:blur(3px)}
.controls button{border:1.5px solid rgba(57,35,79,.25);border-radius:999px;background:#fffdf8;color:var(--ink);padding:9px 17px;font-size:13px;font-weight:850;box-shadow:0 3px 0 rgba(57,35,79,.12);cursor:pointer}
.controls button:hover{background:#f2ebdf}
.time{font-size:12px;font-weight:850;color:#8b7a98;font-variant-numeric:tabular-nums;margin-right:5px}
.grid-toggle{position:absolute;right:2.5%;top:2.5%;z-index:5;border:1px solid rgba(57,35,79,.18);border-radius:999px;background:#fffdf8;color:#7a678e;padding:6px 12px;font-size:11px;font-weight:800;cursor:pointer}
#guides{opacity:0}
.frame.guides #guides{opacity:.45}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<!-- original narration captions, using the exact cue-relative audio recognition times -->
<g id="caption-group">
 <rect x="190" y="746" width="1220" height="64" rx="20" fill="#fffdf8" stroke="#e6ded1" stroke-width="1.5" opacity=".96"/>
 <text id="caption" x="800" y="786" text-anchor="middle" class="caption">观察某一类可比较的存量时，可以用期末存量等于期初存量加流入减流出的关系。</text>
</g>
</svg>

<div class="controls">
 <span class="time" id="time">00:00.0 / 00:22.8</span>
 <button id="pause">暂停</button>
 <button id="restart">重新播放</button>
</div>
</div>

<script>
const DURATION=22752.653;
const GLOBAL_START=387.459795;
const captions=[
 {at:0.094695,text:"观察某一类可比较的存量时，可以用期末存量等于期初存量加流入减流出的关系。"},
 {at:9.094695,text:"若流入大于损耗，净存量增加；"},
 {at:12.094695,text:"相等则稳定；"},
 {at:14.094695,text:"流出较大则下降。"},
 {at:17.094695,text:"技能等复杂存量不一定能用单一数量测量，这里只是结构模型。"}
];
const lanes=[
 {id:0,initial:.46,final:.72,inCount:4,outCount:2,inSpeed:112,outSpeed:92},
 {id:1,initial:.46,final:.46,inCount:3,outCount:3,inSpeed:102,outSpeed:102},
 {id:2,initial:.46,final:.22,inCount:2,outCount:4,inSpeed:92,outSpeed:112}
];
const $=id=>document.getElementById(id);
const EMBEDDED=window.parent!==window;
if(EMBEDDED)document.body.classList.add("embed-mode");
const ns="http://www.w3.org/2000/svg";
let elapsed=0,start=performance.now(),paused=false,raf=0,particles=[];
const pathMap={};
for(const lane of lanes){
 pathMap["in"+lane.id]=$("inPath"+lane.id);
 pathMap["out"+lane.id]=$("outPath"+lane.id);
}
function makeParticles(){
 const host=$("particles");host.replaceChildren();particles=[];
 for(const lane of lanes){
  for(const [kind,count,color,speed] of [
   ["in",lane.inCount,"#35b9c0",lane.inSpeed],
   ["out",lane.outCount,"#ef7965",lane.outSpeed]
  ]){
   const path=pathMap[kind+lane.id];
   for(let i=0;i<count;i++){
    const c=document.createElementNS(ns,"circle");
    c.setAttribute("r",i%2===0?"6":"4.5");
    c.setAttribute("fill",color);
    c.setAttribute("stroke","#fffdf7");
    c.setAttribute("stroke-width","1.5");
    c.setAttribute("opacity",".96");
    host.appendChild(c);
    particles.push({node:c,path,speed,phase:i/count,lane:lane.id,kind});
   }
  }
 }
}
function ease(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}
function updateWater(lane,t){
 const id=lane.id;
 const left=[116,666,1216][id],right=left+269,bottom=527,top=350;
 const p=ease(Math.min(1,t/9.0));
 const fraction=lane.initial+(lane.final-lane.initial)*p;
 const surface=bottom-(bottom-top)*fraction;
 const wave=Math.sin(t*2.2+id*.8)*3.2;
 const mid=(left+right)/2;
 const d=`M${left} ${bottom} L${left} ${surface+wave*.25} Q${mid} ${surface-wave} ${right} ${surface+wave*.25} L${right} ${bottom} Z`;
 const wd=`M${left} ${surface+wave*.25} Q${left+67} ${surface-wave} ${mid} ${surface+wave*.2} T${right} ${surface+wave*.25}`;
 $("water"+id).setAttribute("d",d);
 $("wave"+id).setAttribute("d",wd);
}
function update(ms){
 const sec=ms/1000;
 lanes.forEach(l=>updateWater(l,sec));
 particles.forEach(p=>{
  const len=p.path.getTotalLength();
  const dist=((sec*p.speed/len+p.phase)%1)*len;
  const pt=p.path.getPointAtLength(dist);
  p.node.setAttribute("cx",pt.x);p.node.setAttribute("cy",pt.y);
 });
 const caption=captions.reduce((a,b)=>sec>=b.at?b:a,captions[0]);
 $("caption").textContent=caption.text;
 const s=Math.floor(sec),d=Math.floor((ms%1000)/100);
 $("time").textContent=`00:${String(s).padStart(2,"0")}.${d} / 00:22.8`;
}
function tick(now){
 if(!paused){elapsed=Math.min(DURATION,now-start);update(elapsed);}
 if(elapsed<DURATION&&!paused)raf=requestAnimationFrame(tick);
}
$("pause").addEventListener("click",()=>{
 if(!paused){paused=true;$("pause").textContent="继续";cancelAnimationFrame(raf);}
 else{paused=false;start=performance.now()-elapsed;$("pause").textContent="暂停";raf=requestAnimationFrame(tick);}
});
$("restart").addEventListener("click",()=>{
 paused=false;elapsed=0;start=performance.now();$("pause").textContent="暂停";update(0);cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
});
$("gridToggle").addEventListener("click",()=>{
 $("frame").classList.toggle("guides");
 $("gridToggle").textContent=$("frame").classList.contains("guides")?"隐藏对齐辅助线":"显示对齐辅助线";
});
window.__flowInflowV3={sync(ms){paused=true;cancelAnimationFrame(raf);elapsed=Math.max(0,Math.min(DURATION,ms));update(elapsed);},getState(){return {elapsed,duration:DURATION,particleCount:particles.length};}};
window.addEventListener("load",()=>{makeParticles();elapsed=0;start=performance.now();update(0);if(!EMBEDDED)raf=requestAnimationFrame(tick);});
</script>
</body>
</html>
