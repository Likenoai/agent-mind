<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5479a7"/></marker><linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#eaf3ff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient></defs><rect width="1600" height="1060" fill="#f7faff"/><rect x="20" y="20" width="1560" height="1020" rx="26" fill="#ffffff" stroke="#d8e3f0" stroke-width="2"/><rect x="22" y="22" width="1556" height="126" rx="24" fill="url(#head)"/><text x="58" y="78" font-size="39" font-weight="850" fill="#102b4c" text-anchor="start">AI 对人与人关系的双重影响：替代还是增强？</text><text x="60" y="118" font-size="20" font-weight="500" fill="#58708c" text-anchor="start">不要只看风险，也要看它如何介入真实关系</text><rect x="42" y="165" width="1516" height="88" rx="16" fill="#edf4ff" stroke="#cbdcf2" stroke-width="2"/><text x="70" y="218" font-size="22" font-weight="800" fill="#17365f" text-anchor="start">关键分界线</text><text x="800" y="218" font-size="22" font-weight="750" fill="#315b89" text-anchor="middle">AI 替代了与人接触本身？   还是帮助人更好地进入真实关系？</text><rect x="42" y="285" width="735" height="475" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M60 285 H759 Q777 285 777 303 V343 H42 V303 Q42 285 60 285" fill="#c35b67" opacity=".10"/><text x="64" y="323" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">一、替代路径</text><rect x="70" y="365" width="150" height="125" rx="14" fill="#fff7f7" stroke="#edcdd1" stroke-width="1"/><text x="145" y="414" font-size="19" font-weight="800" fill="#9e4652" text-anchor="middle">遇到问题</text><text x="145" y="450" font-size="17" font-weight="600" fill="#8b5660" text-anchor="middle">先找 AI</text><path d="M222 425 L240 425" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="245" y="365" width="150" height="125" rx="14" fill="#fff7f7" stroke="#edcdd1" stroke-width="1"/><text x="320" y="414" font-size="19" font-weight="800" fill="#9e4652" text-anchor="middle">减少真人</text><text x="320" y="450" font-size="17" font-weight="600" fill="#8b5660" text-anchor="middle">表达与求助</text><path d="M397 425 L415 425" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="420" y="365" width="150" height="125" rx="14" fill="#fff7f7" stroke="#edcdd1" stroke-width="1"/><text x="495" y="414" font-size="19" font-weight="800" fill="#9e4652" text-anchor="middle">降低耐心</text><text x="495" y="450" font-size="17" font-weight="600" fill="#8b5660" text-anchor="middle">等待、分歧与互惠</text><path d="M572 425 L590 425" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="595" y="365" width="150" height="125" rx="14" fill="#fff7f7" stroke="#edcdd1" stroke-width="1"/><text x="670" y="414" font-size="19" font-weight="800" fill="#9e4652" text-anchor="middle">关系弱化</text><text x="670" y="450" font-size="17" font-weight="600" fill="#8b5660" text-anchor="middle">建立与维护</text><rect x="70" y="530" width="675" height="175" rx="14" fill="#fff1f2" stroke="#f0d1d4" stroke-width="1"/><text x="92" y="570" font-size="20" font-weight="800" fill="#a34854" text-anchor="start">可能的风险</text><circle cx="100" cy="614" r="5" fill="#d65b68"/><text x="117" y="620" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">少找真人、减少披露</text><circle cx="100" cy="659" r="5" fill="#d65b68"/><text x="117" y="665" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">习惯单向适配、对关系要求更高但投入更少</text><rect x="800" y="285" width="758" height="475" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M818 285 H1540 Q1558 285 1558 303 V343 H800 V303 Q800 285 818 285" fill="#379567" opacity=".10"/><text x="822" y="323" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">二、增强路径</text><rect x="830" y="365" width="150" height="125" rx="14" fill="#f4fbf6" stroke="#cce7d6" stroke-width="1"/><text x="905" y="414" font-size="19" font-weight="800" fill="#28784b" text-anchor="middle">先用 AI</text><text x="905" y="450" font-size="17" font-weight="600" fill="#527a62" text-anchor="middle">整理想法</text><path d="M982 425 L1000 425" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1008" y="365" width="150" height="125" rx="14" fill="#f4fbf6" stroke="#cce7d6" stroke-width="1"/><text x="1083" y="414" font-size="19" font-weight="800" fill="#28784b" text-anchor="middle">准备沟通</text><text x="1083" y="450" font-size="17" font-weight="600" fill="#527a62" text-anchor="middle">组织表达</text><path d="M1160 425 L1178 425" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1186" y="365" width="150" height="125" rx="14" fill="#f4fbf6" stroke="#cce7d6" stroke-width="1"/><text x="1261" y="414" font-size="19" font-weight="800" fill="#28784b" text-anchor="middle">理解彼此</text><text x="1261" y="450" font-size="17" font-weight="600" fill="#527a62" text-anchor="middle">解释与倾听</text><path d="M1338 425 L1356 425" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1364" y="365" width="150" height="125" rx="14" fill="#f4fbf6" stroke="#cce7d6" stroke-width="1"/><text x="1439" y="414" font-size="19" font-weight="800" fill="#28784b" text-anchor="middle">进入关系</text><text x="1439" y="450" font-size="17" font-weight="600" fill="#527a62" text-anchor="middle">修复与合作</text><rect x="830" y="530" width="700" height="175" rx="14" fill="#effaf4" stroke="#cce6d4" stroke-width="1"/><text x="852" y="570" font-size="20" font-weight="800" fill="#28784b" text-anchor="start">可能的增强点</text><circle cx="860" cy="614" r="5" fill="#3b9a62"/><text x="877" y="620" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">帮助组织表达、准备重要沟通</text><circle cx="860" cy="659" r="5" fill="#3b9a62"/><text x="877" y="665" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">辅助冲突分析、降低开口门槛</text><rect x="42" y="790" width="1516" height="155" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M60 790 H1540 Q1558 790 1558 808 V848 H42 V808 Q42 790 60 790" fill="#1f6feb" opacity=".10"/><text x="64" y="828" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">三、决定走向的四个关键变量</text><rect x="70" y="855" width="335" height="70" rx="12" fill="#f4f8ff" stroke="#d8e4f3" stroke-width="1"/><text x="88" y="883" font-size="18" font-weight="800" fill="#315b89" text-anchor="start">使用目的</text><text x="88" y="913" font-size="15" font-weight="550" fill="#60758d" text-anchor="start">替代交流 / 辅助交流</text><rect x="445" y="855" width="335" height="70" rx="12" fill="#f4f8ff" stroke="#d8e4f3" stroke-width="1"/><text x="463" y="883" font-size="18" font-weight="800" fill="#315b89" text-anchor="start">AI 风格</text><text x="463" y="913" font-size="15" font-weight="550" fill="#60758d" text-anchor="start">迎合 / 合作 / 促进反思</text><rect x="820" y="855" width="335" height="70" rx="12" fill="#f4f8ff" stroke="#d8e4f3" stroke-width="1"/><text x="838" y="883" font-size="18" font-weight="800" fill="#315b89" text-anchor="start">用户意识</text><text x="838" y="913" font-size="15" font-weight="550" fill="#60758d" text-anchor="start">能否区分 AI 与真人关系</text><rect x="1195" y="855" width="335" height="70" rx="12" fill="#f4f8ff" stroke="#d8e4f3" stroke-width="1"/><text x="1213" y="883" font-size="18" font-weight="800" fill="#315b89" text-anchor="start">关系基础</text><text x="1213" y="913" font-size="15" font-weight="550" fill="#60758d" text-anchor="start">原本稳固 / 原本脆弱</text><rect x="42" y="970" width="1516" height="65" rx="14" fill="#173d70" stroke="#173d70" stroke-width="1"/><text x="800" y="1010" font-size="20" font-weight="800" fill="#ffffff" text-anchor="middle">AI 不会自动替代或增强关系；关键在于它被用来逃离真实关系，还是更好地进入真实关系。</text></svg>