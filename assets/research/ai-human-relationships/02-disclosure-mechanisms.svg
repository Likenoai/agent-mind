<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5479a7"/></marker><linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#eaf3ff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient></defs><rect width="1600" height="1060" fill="#f7faff"/><rect x="20" y="20" width="1560" height="1020" rx="26" fill="#ffffff" stroke="#d8e3f0" stroke-width="2"/><rect x="22" y="22" width="1556" height="126" rx="24" fill="url(#head)"/><text x="58" y="78" font-size="39" font-weight="850" fill="#102b4c" text-anchor="start">为什么人在某些情况下更愿意向 AI 表达？</text><text x="60" y="118" font-size="20" font-weight="500" fill="#58708c" text-anchor="start">自我披露对象选择的心理机制</text><rect x="42" y="170" width="320" height="420" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M60 170 H344 Q362 170 362 188 V228 H42 V188 Q42 170 60 170" fill="#1f6feb" opacity=".10"/><text x="64" y="208" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">一、表达需求出现</text><rect x="70" y="235" width="264" height="48" rx="12" fill="#f1f6ff" stroke="#dce7f5" stroke-width="1"/><text x="202" y="266" font-size="19" font-weight="650" fill="#315b89" text-anchor="middle">有困惑</text><rect x="70" y="301" width="264" height="48" rx="12" fill="#f1f6ff" stroke="#dce7f5" stroke-width="1"/><text x="202" y="332" font-size="19" font-weight="650" fill="#315b89" text-anchor="middle">有情绪</text><rect x="70" y="367" width="264" height="48" rx="12" fill="#f1f6ff" stroke="#dce7f5" stroke-width="1"/><text x="202" y="398" font-size="19" font-weight="650" fill="#315b89" text-anchor="middle">有敏感想法</text><rect x="70" y="433" width="264" height="48" rx="12" fill="#f1f6ff" stroke="#dce7f5" stroke-width="1"/><text x="202" y="464" font-size="19" font-weight="650" fill="#315b89" text-anchor="middle">有未成形观点</text><rect x="70" y="499" width="264" height="48" rx="12" fill="#f1f6ff" stroke="#dce7f5" stroke-width="1"/><text x="202" y="530" font-size="19" font-weight="650" fill="#315b89" text-anchor="middle">需要建议</text><rect x="385" y="170" width="700" height="420" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M403 170 H1067 Q1085 170 1085 188 V228 H385 V188 Q385 170 403 170" fill="#1f6feb" opacity=".10"/><text x="407" y="208" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">二、四个关键机制</text><rect x="410" y="238" width="300" height="135" rx="14" fill="#f4f8ff" stroke="#dce7f5" stroke-width="1"/><text x="428" y="276" font-size="19" font-weight="800" fill="#315b89" text-anchor="start">社会评价压力较低</text><text x="428" y="316" font-size="16" font-weight="500" fill="#536a83" text-anchor="start">担心被看不起、被记住或被传播</text><rect x="760" y="238" width="300" height="135" rx="14" fill="#f4f8ff" stroke="#dce7f5" stroke-width="1"/><text x="778" y="276" font-size="19" font-weight="800" fill="#315b89" text-anchor="start">不想给真人增加负担</text><text x="778" y="316" font-size="16" font-weight="500" fill="#536a83" text-anchor="start">不想麻烦朋友，也不想让别人担心</text><rect x="410" y="405" width="300" height="135" rx="14" fill="#f4f8ff" stroke="#dce7f5" stroke-width="1"/><text x="428" y="443" font-size="19" font-weight="800" fill="#315b89" text-anchor="start">表达成本低、可控性高</text><text x="428" y="483" font-size="16" font-weight="500" fill="#536a83" text-anchor="start">随时说、可反复说、可随时结束</text><rect x="760" y="405" width="300" height="135" rx="14" fill="#f4f8ff" stroke="#dce7f5" stroke-width="1"/><text x="778" y="443" font-size="19" font-weight="800" fill="#315b89" text-anchor="start">需要认知支持</text><text x="778" y="483" font-size="16" font-weight="500" fill="#536a83" text-anchor="start">整理想法、补充背景、发现漏洞</text><rect x="1110" y="170" width="448" height="420" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M1128 170 H1540 Q1558 170 1558 188 V228 H1110 V188 Q1110 170 1128 170" fill="#1f6feb" opacity=".10"/><text x="1132" y="208" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">三、向 AI 表达 vs 向真人表达</text><rect x="1132" y="235" width="190" height="305" rx="12" fill="#eef5ff" stroke="#d6e4f7" stroke-width="1"/><text x="1227" y="270" font-size="19" font-weight="800" fill="#315b89" text-anchor="middle">向 AI 表达</text><circle cx="1152" cy="314" r="5" fill="#3d7bc4"/><text x="1169" y="320" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">低评价压力</text><circle cx="1152" cy="357" r="5" fill="#3d7bc4"/><text x="1169" y="363" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">低负担</text><circle cx="1152" cy="400" r="5" fill="#3d7bc4"/><text x="1169" y="406" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">更可控</text><circle cx="1152" cy="443" r="5" fill="#3d7bc4"/><text x="1169" y="449" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">即时回应</text><circle cx="1152" cy="486" r="5" fill="#3d7bc4"/><text x="1169" y="492" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">可反复讨论</text><rect x="1335" y="235" width="195" height="305" rx="12" fill="#f6f2ff" stroke="#e1d7f2" stroke-width="1"/><text x="1432" y="270" font-size="19" font-weight="800" fill="#5d4b83" text-anchor="middle">向真人表达</text><circle cx="1355" cy="314" r="5" fill="#8b70b9"/><text x="1372" y="320" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">有评价风险</text><circle cx="1355" cy="357" r="5" fill="#8b70b9"/><text x="1372" y="363" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">可能有互惠义务</text><circle cx="1355" cy="400" r="5" fill="#8b70b9"/><text x="1372" y="406" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">回应受现实限制</text><circle cx="1355" cy="443" r="5" fill="#8b70b9"/><text x="1372" y="449" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">可能有误解</text><circle cx="1355" cy="486" r="5" fill="#8b70b9"/><text x="1372" y="492" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">真实支持与承诺</text><rect x="42" y="630" width="1516" height="300" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M60 630 H1540 Q1558 630 1558 648 V688 H42 V648 Q42 630 60 630" fill="#1f6feb" opacity=".10"/><text x="64" y="668" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">四、一个人的对象选择过程</text><rect x="75" y="710" width="250" height="90" rx="14" fill="#f2f7ff" stroke="#d6e4f7" stroke-width="1"/><text x="200" y="748" font-size="21" font-weight="800" fill="#315b89" text-anchor="middle">我有话想说</text><text x="200" y="780" font-size="16" font-weight="500" fill="#60758d" text-anchor="middle">表达 / 求助 / 梳理</text><path d="M330 755 L390 755" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="400" y="710" width="300" height="90" rx="14" fill="#f2f7ff" stroke="#d6e4f7" stroke-width="1"/><text x="550" y="748" font-size="19" font-weight="800" fill="#315b89" text-anchor="middle">比较对象的收益与成本</text><text x="550" y="780" font-size="16" font-weight="500" fill="#60758d" text-anchor="middle">我此刻最需要什么？</text><path d="M705 755 L760 755" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="770" y="685" width="345" height="100" rx="14" fill="#eef5ff" stroke="#cbdcf2" stroke-width="1"/><text x="942" y="724" font-size="18" font-weight="750" fill="#315b89" text-anchor="middle">担心评价、打扰别人</text><text x="942" y="756" font-size="17" font-weight="550" fill="#60758d" text-anchor="middle">或想先理清思路</text><rect x="1160" y="685" width="335" height="100" rx="14" fill="#eaf3ff" stroke="#a9c8ed" stroke-width="1"/><text x="1327" y="746" font-size="20" font-weight="800" fill="#315b89" text-anchor="middle">更可能优先选择 AI</text><path d="M1120 735 L1150 735" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="770" y="810" width="345" height="90" rx="14" fill="#f7f2ff" stroke="#d9c9ef" stroke-width="1"/><text x="942" y="846" font-size="18" font-weight="750" fill="#5c4b7d" text-anchor="middle">希望被关心、共同面对</text><text x="942" y="875" font-size="17" font-weight="550" fill="#74638e" text-anchor="middle">获得长期支持</text><rect x="1160" y="810" width="335" height="90" rx="14" fill="#f3edff" stroke="#d3c0ec" stroke-width="1"/><text x="1327" y="865" font-size="20" font-weight="800" fill="#5c4b7d" text-anchor="middle">更可能优先选择真人</text><path d="M1120 855 L1150 855" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="42" y="955" width="1516" height="75" rx="14" fill="#173d70" stroke="#173d70" stroke-width="1"/><text x="800" y="1000" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">结论：人不是单纯更喜欢 AI，而是在特定情境下选择社会成本更低的表达对象。</text></svg>