<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5479a7"/></marker><linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#eaf3ff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient></defs><rect width="1600" height="1100" fill="#f7faff"/><rect x="20" y="20" width="1560" height="1060" rx="26" fill="#ffffff" stroke="#d8e3f0" stroke-width="2"/><rect x="22" y="22" width="1556" height="126" rx="24" fill="url(#head)"/><text x="58" y="78" font-size="39" font-weight="850" fill="#102b4c" text-anchor="start">当 AI 成为我们最先想要沟通的对象，人与人的关系会发生什么变化？</text><text x="60" y="118" font-size="20" font-weight="500" fill="#58708c" text-anchor="start">研究总览｜事实、机制、影响与未解决问题</text><rect x="42" y="170" width="735" height="190" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M60 170 H759 Q777 170 777 188 V228 H42 V188 Q42 170 60 170" fill="#1f6feb" opacity=".10"/><text x="64" y="208" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">一、先求证事实</text><circle cx="72" cy="239" r="5" fill="#3978c8"/><text x="89" y="245" font-size="19" font-weight="500" fill="#26384d" text-anchor="start">AI 已进入学习、信息获取、问题解决与情绪表达</text><circle cx="72" cy="279" r="5" fill="#3978c8"/><text x="89" y="285" font-size="19" font-weight="500" fill="#26384d" text-anchor="start">部分人会在特定情境下优先向 AI 表达或求助</text><circle cx="72" cy="319" r="5" fill="#3978c8"/><text x="89" y="325" font-size="19" font-weight="500" fill="#26384d" text-anchor="start">尚不能推出：多数人在所有事情上都先找 AI</text><rect x="800" y="170" width="758" height="190" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M818 170 H1540 Q1558 170 1558 188 V228 H800 V188 Q800 170 818 170" fill="#1f6feb" opacity=".10"/><text x="822" y="208" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">二、为什么某些情况下更愿意找 AI？</text><rect x="828" y="238" width="330" height="48" rx="12" fill="#f2f7ff" stroke="#dbe7f6" stroke-width="1"/><text x="846" y="269" font-size="19" font-weight="650" fill="#28496f" text-anchor="start">社会评价压力较低</text><rect x="1180" y="238" width="330" height="48" rx="12" fill="#f2f7ff" stroke="#dbe7f6" stroke-width="1"/><text x="1198" y="269" font-size="19" font-weight="650" fill="#28496f" text-anchor="start">不想给真人增加负担</text><rect x="828" y="302" width="330" height="48" rx="12" fill="#f2f7ff" stroke="#dbe7f6" stroke-width="1"/><text x="846" y="333" font-size="19" font-weight="650" fill="#28496f" text-anchor="start">表达成本低、可控性高</text><rect x="1180" y="302" width="330" height="48" rx="12" fill="#f2f7ff" stroke="#dbe7f6" stroke-width="1"/><text x="1198" y="333" font-size="19" font-weight="650" fill="#28496f" text-anchor="start">整理想法、获取认知支持</text><text x="48" y="414" font-size="25" font-weight="800" fill="#17365f" text-anchor="start">三、从表达选择到关系影响：需要检验的过程链</text><rect x="42" y="445" width="220" height="112" rx="16" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><text x="152" y="485" font-size="22" font-weight="800" fill="#17365f" text-anchor="middle">表达需求</text><text x="152" y="520" font-size="16" font-weight="500" fill="#667b92" text-anchor="middle">想说、求助、梳理</text><path d="M267 500 L294 500" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="300" y="445" width="220" height="112" rx="16" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><text x="410" y="485" font-size="22" font-weight="800" fill="#17365f" text-anchor="middle">对象比较</text><text x="410" y="520" font-size="16" font-weight="500" fill="#667b92" text-anchor="middle">收益与社会成本</text><path d="M525 500 L552 500" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="558" y="445" width="220" height="112" rx="16" fill="#eaf3ff" stroke="#7ca8df" stroke-width="2"/><text x="668" y="485" font-size="22" font-weight="800" fill="#17365f" text-anchor="middle">选择 AI</text><text x="668" y="520" font-size="16" font-weight="500" fill="#667b92" text-anchor="middle">特定情境下优先</text><path d="M783 500 L810 500" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="816" y="445" width="220" height="112" rx="16" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><text x="926" y="485" font-size="22" font-weight="800" fill="#17365f" text-anchor="middle">交互习惯</text><text x="926" y="520" font-size="16" font-weight="500" fill="#667b92" text-anchor="middle">反复体验与学习</text><path d="M1041 500 L1068 500" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1074" y="445" width="220" height="112" rx="16" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><text x="1184" y="485" font-size="22" font-weight="800" fill="#17365f" text-anchor="middle">期待迁移</text><text x="1184" y="520" font-size="16" font-weight="500" fill="#667b92" text-anchor="middle">对真人的评价</text><path d="M1299 500 L1326 500" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1332" y="445" width="220" height="112" rx="16" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><text x="1442" y="485" font-size="22" font-weight="800" fill="#17365f" text-anchor="middle">关系结果</text><text x="1442" y="520" font-size="16" font-weight="500" fill="#667b92" text-anchor="middle">可能替代或增强</text><rect x="300" y="575" width="460" height="58" rx="12" fill="#f6f2ff" stroke="#d6c9f2" stroke-width="1"/><text x="322" y="610" font-size="18" font-weight="600" fill="#55477d" text-anchor="start">找 AI：即时、低压力、可控、持续上下文</text><rect x="790" y="575" width="500" height="58" rx="12" fill="#f3f6fa" stroke="#d3dce7" stroke-width="1"/><text x="812" y="610" font-size="18" font-weight="600" fill="#44566b" text-anchor="start">找真人：有评价、有互惠、有拒绝、有真实责任</text><rect x="42" y="665" width="735" height="210" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M60 665 H759 Q777 665 777 683 V723 H42 V683 Q42 665 60 665" fill="#1f6feb" opacity=".10"/><text x="64" y="703" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">四、长期使用后可能出现的期待变化</text><circle cx="75" cy="732" r="5" fill="#3978c8"/><text x="92" y="738" font-size="18" font-weight="500" fill="#26384d" text-anchor="start">更高的回应速度期待</text><circle cx="75" cy="760" r="5" fill="#3978c8"/><text x="92" y="766" font-size="18" font-weight="500" fill="#26384d" text-anchor="start">更高的理解与记忆期待</text><circle cx="75" cy="788" r="5" fill="#3978c8"/><text x="92" y="794" font-size="18" font-weight="500" fill="#26384d" text-anchor="start">更强的认同期待</text><circle cx="75" cy="816" r="5" fill="#3978c8"/><text x="92" y="822" font-size="18" font-weight="500" fill="#26384d" text-anchor="start">更弱的互惠耐心</text><circle cx="75" cy="844" r="5" fill="#3978c8"/><text x="92" y="850" font-size="18" font-weight="500" fill="#26384d" text-anchor="start">更低的分歧容忍度</text><rect x="425" y="720" width="310" height="120" rx="14" fill="#f1f6ff" stroke="#d8e5f7" stroke-width="1"/><text x="445" y="760" font-size="19" font-weight="800" fill="#315b89" text-anchor="start">证据边界</text><text x="445" y="792" font-size="17" font-weight="550" fill="#526b86" text-anchor="start">短期迁移已有实验支持</text><text x="445" y="820" font-size="17" font-weight="550" fill="#526b86" text-anchor="start">长期稳定改变仍待纵向研究</text><rect x="800" y="665" width="758" height="210" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M818 665 H1540 Q1558 665 1558 683 V723 H800 V683 Q800 665 818 665" fill="#1f6feb" opacity=".10"/><text x="822" y="703" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">五、AI 对真人关系可能有双重影响</text><rect x="828" y="730" width="330" height="118" rx="14" fill="#fff3f4" stroke="#f0c9ce" stroke-width="1"/><text x="850" y="763" font-size="20" font-weight="800" fill="#9c3f4b" text-anchor="start">替代风险</text><circle cx="850" cy="794" r="5" fill="#d85b6a"/><text x="867" y="800" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">减少向真人表达</text><circle cx="850" cy="824" r="5" fill="#d85b6a"/><text x="867" y="830" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">习惯单向适配</text><rect x="1180" y="730" width="345" height="118" rx="14" fill="#effaf4" stroke="#c5e6d2" stroke-width="1"/><text x="1202" y="763" font-size="20" font-weight="800" fill="#28784b" text-anchor="start">增强可能</text><circle cx="1202" cy="794" r="5" fill="#3a9b61"/><text x="1219" y="800" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">整理想法、准备沟通</text><circle cx="1202" cy="824" r="5" fill="#3a9b61"/><text x="1219" y="830" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">促进解释、修复与合作</text><rect x="42" y="900" width="1516" height="105" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M60 900 H1540 Q1558 900 1558 918 V958 H42 V918 Q42 900 60 900" fill="#1f6feb" opacity=".10"/><text x="64" y="938" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">六、当前关键未解问题</text><rect x="68" y="948" width="350" height="42" rx="10" fill="#f7faff" stroke="#dce6f2" stroke-width="1"/><text x="86" y="976" font-size="16" font-weight="600" fill="#314d6d" text-anchor="start">1. 哪些情境最容易优先选择 AI？</text><rect x="440" y="948" width="350" height="42" rx="10" fill="#f7faff" stroke="#dce6f2" stroke-width="1"/><text x="458" y="976" font-size="16" font-weight="600" fill="#314d6d" text-anchor="start">2. 这种选择会不会减少真人交流？</text><rect x="812" y="948" width="350" height="42" rx="10" fill="#f7faff" stroke="#dce6f2" stroke-width="1"/><text x="830" y="976" font-size="16" font-weight="600" fill="#314d6d" text-anchor="start">3. 交互习惯会不会迁移到真人关系？</text><rect x="1184" y="948" width="350" height="42" rx="10" fill="#f7faff" stroke="#dce6f2" stroke-width="1"/><text x="1202" y="976" font-size="16" font-weight="600" fill="#314d6d" text-anchor="start">4. 真人关系中哪些价值无法被 AI 替代？</text><rect x="42" y="1020" width="1516" height="54" rx="14" fill="#173d70" stroke="#173d70" stroke-width="1"/><text x="800" y="1054" font-size="20" font-weight="750" fill="#ffffff" text-anchor="middle">当前判断：AI 已成为部分场景下的重要交流对象；其对人际关系的长期影响仍需区分情境、机制与时间尺度。</text></svg>