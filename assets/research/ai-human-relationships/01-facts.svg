<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5479a7"/></marker><linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#eaf3ff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient></defs><rect width="1600" height="1060" fill="#f7faff"/><rect x="20" y="20" width="1560" height="1020" rx="26" fill="#ffffff" stroke="#d8e3f0" stroke-width="2"/><rect x="22" y="22" width="1556" height="126" rx="24" fill="url(#head)"/><text x="58" y="78" font-size="39" font-weight="850" fill="#102b4c" text-anchor="start">先求证事实：AI 是否正在成为优先交流对象？</text><text x="60" y="118" font-size="20" font-weight="500" fill="#58708c" text-anchor="start">事实核查｜现象存在，但具有情境差异</text><rect x="42" y="170" width="440" height="430" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M60 170 H464 Q482 170 482 188 V228 H42 V188 Q42 170 60 170" fill="#1f6feb" opacity=".10"/><text x="64" y="208" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">一、我们要核查的三个命题</text><circle cx="72" cy="254" r="5" fill="#3978c8"/><text x="89" y="260" font-size="19" font-weight="500" fill="#26384d" text-anchor="start">越来越多人开始使用 AI 进行交流</text><circle cx="72" cy="324" r="5" fill="#3978c8"/><text x="89" y="330" font-size="19" font-weight="500" fill="#26384d" text-anchor="start">AI 开始处理过去常由人与人交流完成的部分任务</text><circle cx="72" cy="394" r="5" fill="#3978c8"/><text x="89" y="400" font-size="19" font-weight="500" fill="#26384d" text-anchor="start">部分场景下，人会优先找 AI 而不是找真人</text><rect x="70" y="465" width="380" height="92" rx="14" fill="#f2f7ff" stroke="#dce7f5" stroke-width="1"/><text x="92" y="505" font-size="18" font-weight="750" fill="#315b89" text-anchor="start">注意：使用增长不等于关系替代</text><text x="92" y="535" font-size="16" font-weight="500" fill="#60758d" text-anchor="start">必须分别检验使用、选择与关系结果</text><rect x="505" y="170" width="560" height="430" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M523 170 H1047 Q1065 170 1065 188 V228 H505 V188 Q505 170 523 170" fill="#1f6feb" opacity=".10"/><text x="527" y="208" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">二、目前证据支持到哪里？</text><rect x="530" y="232" width="510" height="56" rx="12" fill="#eaf7ef" stroke="#2d8a55" stroke-width="1"/><text x="550" y="267" font-size="17" font-weight="800" fill="#2d8a55" text-anchor="start">已证实</text><text x="680" y="267" font-size="16" font-weight="550" fill="#334a63" text-anchor="start">AI 广泛进入学习、信息获取和问题解决</text><rect x="530" y="300" width="510" height="56" rx="12" fill="#eaf7ef" stroke="#2d8a55" stroke-width="1"/><text x="550" y="335" font-size="17" font-weight="800" fill="#2d8a55" text-anchor="start">已证实</text><text x="680" y="335" font-size="16" font-weight="550" fill="#334a63" text-anchor="start">部分人用 AI 讨论个人、社交和情绪问题</text><rect x="530" y="368" width="510" height="56" rx="12" fill="#edf4ff" stroke="#3e76b8" stroke-width="1"/><text x="550" y="403" font-size="17" font-weight="800" fill="#3e76b8" text-anchor="start">部分支持</text><text x="680" y="403" font-size="16" font-weight="550" fill="#334a63" text-anchor="start">特定情境下，部分人优先选择 AI</text><rect x="530" y="436" width="510" height="56" rx="12" fill="#fff1f1" stroke="#c34f5c" stroke-width="1"/><text x="550" y="471" font-size="17" font-weight="800" fill="#c34f5c" text-anchor="start">未证实</text><text x="680" y="471" font-size="16" font-weight="550" fill="#334a63" text-anchor="start">大多数人在所有事情上都先找 AI</text><rect x="530" y="504" width="510" height="56" rx="12" fill="#fff1f1" stroke="#c34f5c" stroke-width="1"/><text x="550" y="539" font-size="17" font-weight="800" fill="#c34f5c" text-anchor="start">未证实</text><text x="680" y="539" font-size="16" font-weight="550" fill="#334a63" text-anchor="start">AI 已普遍取代人与人的关系</text><rect x="1090" y="170" width="468" height="430" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M1108 170 H1540 Q1558 170 1558 188 V228 H1090 V188 Q1090 170 1108 170" fill="#1f6feb" opacity=".10"/><text x="1112" y="208" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">三、关键是区分使用情境</text><rect x="1115" y="232" width="205" height="330" rx="14" fill="#f0f8f2" stroke="#cce6d4" stroke-width="1"/><text x="1132" y="270" font-size="19" font-weight="800" fill="#28784b" text-anchor="start">更可能找 AI</text><circle cx="1140" cy="314" r="5" fill="#3b9a62"/><text x="1157" y="320" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">难以启齿</text><circle cx="1140" cy="369" r="5" fill="#3b9a62"/><text x="1157" y="375" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">低成本咨询</text><circle cx="1140" cy="424" r="5" fill="#3b9a62"/><text x="1157" y="430" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">知识问题</text><circle cx="1140" cy="479" r="5" fill="#3b9a62"/><text x="1157" y="485" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">先整理思路</text><rect x="1330" y="232" width="205" height="330" rx="14" fill="#fff4f4" stroke="#f0d1d4" stroke-width="1"/><text x="1347" y="270" font-size="19" font-weight="800" fill="#a34854" text-anchor="start">真人仍重要</text><circle cx="1355" cy="314" r="5" fill="#d65c69"/><text x="1372" y="320" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">普通闲聊</text><circle cx="1355" cy="369" r="5" fill="#d65c69"/><text x="1372" y="375" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">重大人生问题</text><circle cx="1355" cy="424" r="5" fill="#d65c69"/><text x="1372" y="430" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">真实情感支持</text><circle cx="1355" cy="479" r="5" fill="#d65c69"/><text x="1372" y="485" font-size="17" font-weight="500" fill="#26384d" text-anchor="start">共同承担责任</text><rect x="42" y="635" width="1516" height="270" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M60 635 H1540 Q1558 635 1558 653 V693 H42 V653 Q42 635 60 635" fill="#1f6feb" opacity=".10"/><text x="64" y="673" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">四、更准确的事实描述</text><rect x="75" y="715" width="315" height="92" rx="14" fill="#f2f7ff" stroke="#d5e3f4" stroke-width="1"/><text x="232" y="770" font-size="19" font-weight="700" fill="#315b89" text-anchor="middle">AI 使用广泛增加</text><path d="M397 760 L435 760" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="445" y="715" width="315" height="92" rx="14" fill="#f2f7ff" stroke="#d5e3f4" stroke-width="1"/><text x="602" y="770" font-size="19" font-weight="700" fill="#315b89" text-anchor="middle">部分交流需求转向 AI</text><path d="M767 760 L805 760" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="815" y="715" width="315" height="92" rx="14" fill="#f2f7ff" stroke="#d5e3f4" stroke-width="1"/><text x="972" y="770" font-size="19" font-weight="700" fill="#315b89" text-anchor="middle">部分场景出现 AI 优先</text><path d="M1137 760 L1175 760" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1185" y="715" width="315" height="92" rx="14" fill="#f7f1ff" stroke="#cbb9ed" stroke-width="1"/><text x="1342" y="770" font-size="19" font-weight="700" fill="#614b8b" text-anchor="middle">不能推出普遍取代真人</text><rect x="75" y="830" width="1440" height="50" rx="10" fill="#fff9e9" stroke="#f0dfb6" stroke-width="1"/><text x="95" y="862" font-size="18" font-weight="650" fill="#7b5b25" text-anchor="start">研究提醒：调查结果 ≠ 普遍趋势；使用 AI ≠ 减少真人交流；相关性 ≠ 因果性。</text><rect x="42" y="930" width="1516" height="100" rx="14" fill="#173d70" stroke="#173d70" stroke-width="1"/><text x="800" y="970" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">事实判断：AI 优先交流是一个真实但场景依赖的现象，</text><text x="800" y="1003" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">而不是已经无条件普遍成立的社会事实。</text></svg>