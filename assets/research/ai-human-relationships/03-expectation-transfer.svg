<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1060" viewBox="0 0 1600 1060"><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5479a7"/></marker><linearGradient id="head" x1="0" x2="1"><stop offset="0" stop-color="#eaf3ff"/><stop offset="1" stop-color="#f8fbff"/></linearGradient></defs><rect width="1600" height="1060" fill="#f7faff"/><rect x="20" y="20" width="1560" height="1020" rx="26" fill="#ffffff" stroke="#d8e3f0" stroke-width="2"/><rect x="22" y="22" width="1556" height="126" rx="24" fill="url(#head)"/><text x="58" y="78" font-size="39" font-weight="850" fill="#102b4c" text-anchor="start">长期与 AI 交流，会不会改变对真人交流的期待？</text><text x="60" y="118" font-size="20" font-weight="500" fill="#58708c" text-anchor="start">从交流习惯到关系期待的可能迁移</text><rect x="42" y="170" width="345" height="390" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M60 170 H369 Q387 170 387 188 V228 H42 V188 Q42 170 60 170" fill="#1f6feb" opacity=".10"/><text x="64" y="208" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">一、研究先区分三个问题</text><rect x="68" y="240" width="293" height="78" rx="12" fill="#f2f7ff" stroke="#dce7f5" stroke-width="1"/><text x="86" y="270" font-size="18" font-weight="800" fill="#315b89" text-anchor="start">期待改变</text><text x="86" y="300" font-size="15" font-weight="500" fill="#60758d" text-anchor="start">会不会更习惯 AI 式回应？</text><rect x="68" y="340" width="293" height="78" rx="12" fill="#f2f7ff" stroke="#dce7f5" stroke-width="1"/><text x="86" y="370" font-size="18" font-weight="800" fill="#315b89" text-anchor="start">评价改变</text><text x="86" y="400" font-size="15" font-weight="500" fill="#60758d" text-anchor="start">会不会更容易觉得真人交流麻烦？</text><rect x="68" y="440" width="293" height="78" rx="12" fill="#f2f7ff" stroke="#dce7f5" stroke-width="1"/><text x="86" y="470" font-size="18" font-weight="800" fill="#315b89" text-anchor="start">行为改变</text><text x="86" y="500" font-size="15" font-weight="500" fill="#60758d" text-anchor="start">会不会减少真人交流或改变择友方式？</text><rect x="410" y="170" width="790" height="390" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M428 170 H1182 Q1200 170 1200 188 V228 H410 V188 Q410 170 428 170" fill="#1f6feb" opacity=".10"/><text x="432" y="208" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">二、从 AI 交互到真人关系：可能的迁移链</text><rect x="435" y="260" width="135" height="160" rx="14" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><text x="502" y="315" font-size="18" font-weight="800" fill="#315b89" text-anchor="middle">反复与 AI 交流</text><text x="502" y="365" font-size="14" font-weight="500" fill="#60758d" text-anchor="middle">即时回应、持续上下文</text><path d="M572 340 L586 340" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="590" y="260" width="135" height="160" rx="14" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><text x="657" y="315" font-size="18" font-weight="800" fill="#315b89" text-anchor="middle">形成交互习惯</text><text x="657" y="365" font-size="14" font-weight="500" fill="#60758d" text-anchor="middle">习惯快回应、被理解</text><path d="M727 340 L741 340" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="745" y="260" width="135" height="160" rx="14" fill="#eaf3ff" stroke="#91b8e5" stroke-width="2"/><text x="812" y="315" font-size="18" font-weight="800" fill="#315b89" text-anchor="middle">跨情境迁移</text><text x="812" y="365" font-size="14" font-weight="500" fill="#60758d" text-anchor="middle">短期实验已有支持</text><path d="M882 340 L896 340" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="900" y="260" width="135" height="160" rx="14" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><text x="967" y="315" font-size="18" font-weight="800" fill="#315b89" text-anchor="middle">改变评价与期待</text><text x="967" y="365" font-size="14" font-weight="500" fill="#60758d" text-anchor="middle">可能提高对真人的标准</text><path d="M1037 340 L1051 340" stroke="#5479a7" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="1055" y="260" width="135" height="160" rx="14" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><text x="1122" y="315" font-size="18" font-weight="800" fill="#315b89" text-anchor="middle">影响关系</text><text x="1122" y="365" font-size="14" font-weight="500" fill="#60758d" text-anchor="middle">长期结果仍待研究</text><rect x="1225" y="170" width="333" height="390" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M1243 170 H1540 Q1558 170 1558 188 V228 H1225 V188 Q1225 170 1243 170" fill="#1f6feb" opacity=".10"/><text x="1247" y="208" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">三、五个待检验的期待变化</text><circle cx="1255" cy="244" r="5" fill="#3978c8"/><text x="1272" y="250" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">更高的回应速度期待</text><circle cx="1255" cy="302" r="5" fill="#3978c8"/><text x="1272" y="308" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">更高的理解与记忆期待</text><circle cx="1255" cy="360" r="5" fill="#3978c8"/><text x="1272" y="366" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">更强的认同期待</text><circle cx="1255" cy="418" r="5" fill="#3978c8"/><text x="1272" y="424" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">更弱的互惠耐心</text><circle cx="1255" cy="476" r="5" fill="#3978c8"/><text x="1272" y="482" font-size="16" font-weight="500" fill="#26384d" text-anchor="start">更低的分歧容忍度</text><rect x="42" y="600" width="735" height="315" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M60 600 H759 Q777 600 777 618 V658 H42 V618 Q42 600 60 600" fill="#1f6feb" opacity=".10"/><text x="64" y="638" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">四、目前较稳妥的发现</text><circle cx="75" cy="679" r="5" fill="#3978c8"/><text x="92" y="685" font-size="19" font-weight="500" fill="#26384d" text-anchor="start">短期行为和评价迁移已有实验支持</text><circle cx="75" cy="739" r="5" fill="#3978c8"/><text x="92" y="745" font-size="19" font-weight="500" fill="#26384d" text-anchor="start">AI 的回应风格不同，迁移方向可能不同</text><circle cx="75" cy="799" r="5" fill="#3978c8"/><text x="92" y="805" font-size="19" font-weight="500" fill="#26384d" text-anchor="start">过度迎合可能降低修复冲突的意愿</text><rect x="70" y="845" width="670" height="45" rx="10" fill="#edf4ff" stroke="#d9e6f6" stroke-width="1"/><text x="88" y="874" font-size="16" font-weight="750" fill="#315b89" text-anchor="start">注意：短期迁移不等于长期稳定改变。</text><rect x="800" y="600" width="758" height="315" rx="18" fill="#ffffff" stroke="#cbd8e8" stroke-width="2"/><path d="M818 600 H1540 Q1558 600 1558 618 V658 H800 V618 Q800 600 818 600" fill="#1f6feb" opacity=".10"/><text x="822" y="638" font-size="23" font-weight="800" fill="#17365f" text-anchor="start">五、仍未解决的问题</text><circle cx="835" cy="679" r="5" fill="#3978c8"/><text x="852" y="685" font-size="18" font-weight="500" fill="#26384d" text-anchor="start">长期稳定改变是否真的发生？</text><circle cx="835" cy="732" r="5" fill="#3978c8"/><text x="852" y="738" font-size="18" font-weight="500" fill="#26384d" text-anchor="start">这种影响会持续多久？</text><circle cx="835" cy="785" r="5" fill="#3978c8"/><text x="852" y="791" font-size="18" font-weight="500" fill="#26384d" text-anchor="start">哪些人更容易受到影响？</text><circle cx="835" cy="838" r="5" fill="#3978c8"/><text x="852" y="844" font-size="18" font-weight="500" fill="#26384d" text-anchor="start">人机边界意识能否减弱迁移？</text><rect x="42" y="950" width="1516" height="80" rx="14" fill="#173d70" stroke="#173d70" stroke-width="1"/><text x="800" y="1000" font-size="21" font-weight="800" fill="#ffffff" text-anchor="middle">当前结论：短期迁移已有证据；长期系统性改变真人关系期待，仍需纵向研究验证。</text></svg>