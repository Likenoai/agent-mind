name: Trim growth mechanism narration

on:
  push:
    paths:
      - ".github/workflows/trim-growth-narration.yml"

permissions:
  contents: write

jobs:
  trim-narration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download original narration
        env:
          SOURCE_URL: https://assets.vidiq.com/voiceovers/ada57c00-cdef-48f4-94e9-42422eb1952e/50c7629b-9d7a-417f-8121-274b07f9ce69.mp3
        run: |
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" -o /tmp/growth-original.mp3
          test "$(stat -c%s /tmp/growth-original.mp3)" -gt 7000000

      - name: Remove the two redundant spoken passages
        run: |
          mkdir -p series/growth-mechanism/audio-trimmed
          ffmpeg -hide_banner -y -i /tmp/growth-original.mp3 \
            -filter_complex "[0:a]atrim=start=0:end=4.792041,asetpts=PTS-STARTPTS[a0];[0:a]atrim=start=21.237551,asetpts=PTS-STARTPTS[a1];[a0][a1]concat=n=2:v=0:a=1[out]" \
            -map "[out]" -c:a libmp3lame -b:a 128k -ar 44100 -ac 1 -write_xing 1 \
            series/growth-mechanism/audio-trimmed/narration.mp3
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 \
            series/growth-mechanism/audio-trimmed/narration.mp3

      - name: Commit trimmed narration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add series/growth-mechanism/audio-trimmed/narration.mp3
          git commit -m "Add narration with redundant intro passages removed"
          git push
